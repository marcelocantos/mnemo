  T24:
    name: whatsup enriches live sessions with PID→cwd→transcript mapping and supports postmortem directory recovery
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - mnemo_whatsup output includes cwd (from ps -E PWD) for each live claude PID
    - mnemo_whatsup output includes the resolved transcript path (newest-mtime jsonl in the cwd's ~/.claude/projects directory) for each live claude PID
    - When multiple live PIDs share a cwd, all candidate transcripts are listed with a disambiguation hint (mtime, size)
    - A postmortem mode (e.g. mnemo_whatsup --postmortem or a new tool) reports directories that had recent claude activity when no live processes are detected, sourced from transcript mtimes within a recency window
    - Output degrades gracefully when ps -E fails or PWD is absent from env
    context: |-
      After a machine crash, all iTerm2 tabs and their Claude Code sessions are lost. mnemo_recent_activity gives a good approximation of what was open via transcript mtimes, but it's imprecise — tabs not yet indexed or with stale heuristics get missed (e.g. yourworld2 and ge were missed in a real recovery run on 2026-04-15).

      Investigation showed:
      - Claude CLI does NOT expose CLAUDE_SESSION_ID or similar env var.
      - argv is usually just `--continue` — session ID not in args.
      - Transcript .jsonl is not held open (open-append-close), so lsof can't find it.
      - BUT `PWD` is in each claude process's env, readable via `ps -E`.

      Therefore: live PID → cwd is cheap and reliable. From cwd, resolve `~/.claude/projects/&lt;encoded-path&gt;/*.jsonl` and pick the newest-mtime transcript to map PID → transcript. When multiple tabs share a cwd, disambiguate via fsevents (watch jsonl mtime bumps and correlate with CPU bursts) or fall back to listing candidates.

      For postmortem recovery (no live processes), mnemo should at minimum report which directories had running sessions at last observation — derivable from recent session PIDs cached during healthy operation, plus a transcript-mtime sweep.
    tags:
    - observability
    - recovery
    origin: manual
    discovered: 2026-04-15
    achieved: 2026-04-15
  T25:
    name: Compactor and chain detection anchor to MCP connection identity, not heuristics
    status: achieved
    value: 8.0
    cost: 8.0
    actual_cost: 8.0
    acceptance:
    - All three sub-targets (T25.1, T25.2, T25.3) are retired.
    - '10-second before/after /clear empirical test run and recorded: proxy PID is observed to be continuous across /clear, closing the last 5% of the validation gap.'
    - The compactor and /c behave identically to the cwd-heuristic version from the user's perspective for the common case (sane cwd, no concurrent tabs), but remain correct in the edge cases the heuristic fails on (long delays before /clear, multiple tabs in the same cwd, cross-day continuations).
    - STABILITY.md surface catalogue updated to reflect the new connection-anchored mechanism and the demoted heuristic fallback.
    - v0.18.0 release ships with the pivot in place — no 'experimental' or 'fluid' label on /c, mnemo_restore, or the chain mechanism that depends on this.
    context: |-
      **Reframed 2026-04-15.** The original T10 compactor scopes context to session_id, and session chain detection relies on a cwd + timestamp heuristic. Both are flawed: /clear mints a new session_id (so session-scoped compactions don't survive the user's actual mental model of "continuing the same work"), and the chain heuristic breaks on any realistic time gap or multi-tab scenario.

      The better anchor is **MCP connection identity**. The proxy subprocess (and its UDS connection to the daemon) persists across /clear — Claude Code doesn't restart MCP subprocesses. Empirically confirmed with ~95% confidence (three live Claude Code tabs, all with 3h-old proxy etimes matching their parents; mcpbridge server handles connections via a long-lived loop; macOS UDS exposes peer PID via LOCAL_PEERPID). A 10-second before/after /clear PID check at the start of implementation closes the last 5%.

      **Under this model:**
      - Compacted context accumulates inside the process (per-connection), saved to SQLite so ctrl-c + `claude --continue` recovers it.
      - `/c` after /clear dumps in the connection's prior compacted context — no chain inference needed at call time.
      - Session-chain linkages become a side product: whenever a connection's observed session_id changes, that transition is a /clear boundary by construction, and a session_chains row is inserted with mechanism='mcp_connection', confidence='definitive'.
      - The existing cwd-based heuristic stays, demoted to a fallback for pre-upgrade transcripts (sessions whose tool calls were never seen by the daemon).

      **This target is the umbrella.** Decomposed into three sub-targets:

      - 🎯T25.1 — Connection identity plumbing. Vendor the pinned mcpbridge commit into internal/bridge/, extend Handshake with ProxyPID, mint connection_id at accept, recover peer PID via LOCAL_PEERPID (macOS) / SO_PEERCRED (Linux), thread ConnContext through the ToolHandler and MethodFunc signatures. Prerequisite for T25.2 and T25.3.

      - 🎯T25.2 — Compactor, /c, and mnemo_restore reworked around connection_id. Compactions table gains connection_id column. Watcher spawns compactor per connection, not per session. mnemo_restore (and the /c skill) resolve "what to restore" via the connection's session history, not via a chain heuristic.

      - 🎯T25.3 — session_chains gains mechanism='mcp_connection' inserts on observed session transitions. Downstream consumer: mnemo_chain gets definitive linkage for sessions observed under the new model; the cwd heuristic stays as the pre-upgrade fallback.

      Discovered 2026-04-15 while finishing 🎯T10. The user flagged the /clear-survival property of MCP subprocesses; validation confirmed it at the architectural level, leaving only a trivial empirical sanity check for the implementer.

      **Release plan:** v0.18.0 is held pending this pivot. The v0.17 users are not broken; there is no external deadline. Shipping the heuristic-based compactor and then reworking in v0.19 would invalidate any user workflow built on /c.
    tags:
    - chain
    - compactor
    - connection-identity
    - determinism
    origin: discovered while hardening the chain heuristic for /c + mnemo_restore
    discovered: 2026-04-15
    achieved: 2026-04-15
  T25.1:
    name: Connection identity plumbing — vendor bridge, thread ConnContext through handlers
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - internal/bridge/ contains the vendored fork of the pinned mcpbridge library (pre-rewrite commit a16a2c1); the external github.com/marcelocantos/mcpbridge dependency is removed from go.mod.
    - Handshake gains a ProxyPID field; the proxy populates it at startup.
    - Server handleConn mints a connection_id (UUID) at accept and recovers peer PID via LOCAL_PEERPID (macOS) / SO_PEERCRED (Linux). Peer PID is cross-checked against the handshake-reported PID and logged on mismatch but not rejected.
    - A ConnContext type carries (ConnectionID, PID, AcceptedAt) through the request dispatch path.
    - ToolHandler.Call and MethodFunc signatures are extended to receive ConnContext. mnemo's tools.Handler and rpc/server.go extraMethods are updated accordingly.
    - Connection lifecycle is logged at accept and close.
    - A new daemon_connections table records (connection_id PK, pid, accepted_at, closed_at) and is populated at accept / close.
    - Existing tests pass; a new rpc-level test exercises ConnContext propagation via an extra method that echoes its connection_id.
    context: |-
      Prerequisite plumbing for 🎯T25. Load-bearing for T25.2 (compactor) and T25.3 (chain detection), so this lands first.

      Scope: inside mnemo only. The pinned mcpbridge commit is vendored rather than extended in the upstream repo because upstream has since been rewritten into a different product (a multi-MCP-server daemon), so there is no meaningful shared codebase to extend. Vendoring owns the library inside the project where it is actually used.


    name: The vault's ten tools are one tool, since no agent has ever called any of them
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    attestation: 'mnemo_vault replaces all ten mnemo_vault_* tools. TestConsolidationPreservesCapabilities enumerates the ten prior tools by name and asserts each resolves as an op — it fails naming the lost CAPABILITY rather than an op, and also fails if an op appears that replaced no prior tool. Handlers are unchanged: consolidation moved the entry point, not the behaviour. The two stubs keep their honest status — themes_split and themes_merge are labelled STUB in both their opSpec descriptions and the tool description, so folding them alongside eight working ops cannot make them look implemented. Documentation reduced to one vault entry across CLAUDE.md, agents-guide.md and STABILITY.md. HTTP/app callers: the vault has no /api/vault* routes (verified by grep over the route table), so there were none to update — the dashboard and menubar app reach vault state through the health and config surfaces, which are untouched.'
    acceptance:
    - mnemo_vault_status, _sync, _gc, _migration_doc, _bridge_list, _recluster, _themes_inspect, _themes_pin, _themes_split and _themes_merge are replaced by a single op-dispatched entry point following 🎯T143.2's convention.
    - 'Every one of the ten operations is still reachable, with the same arguments and the same output shape. Oracle: an inventory test enumerates the ten and asserts each resolves.'
    - The dashboard, menubar app and any HTTP callers are updated or confirmed unaffected. Vault sync is triggered from more than one place and a missed caller would fail at runtime rather than at build time.
    - 'The two themes stubs keep their honest status: _themes_split and _themes_merge record theme_overrides only and do not apply live. Folding them must not make them look implemented — the consolidated description says which ops are stubs.'
    - Documentation in the three sinks lists one vault tool with its ops, not ten entries.
    context: |-
      The largest single consolidation in 🎯T143: ten registered tools, ~7 KB of schema, and zero agent calls between them across the entire index.

      The vault group is the clearest case for folding precisely because the discoverability cost is near zero — nobody is discovering these today. Seven of the ten were added within the last month (bridge_list 2026-08-01, the four themes tools 2026-08-05) as 🎯T64's sub-targets landed, so the group grew by accretion: each slice added its own tool because that was the natural unit of work, and nothing ever stepped back to ask what the set looked like from an agent's side.

      That accretion pattern is the thing to fix, not just its current output. 🎯T64 still has open sub-targets (🎯T64.9 lessons + GC, 🎯T64.12 cross-repo), and on present trend each will add another mnemo_vault_* tool. Landing this consolidation gives them somewhere to land as ops instead — which is worth more than the surface it reclaims today.

      Note the interaction with 🎯T64.9: it names mnemo_vault_gc_legacy and mnemo_vault_migration_doc(write:) in its own acceptance. Whichever lands second inherits the other's shape; that is a wording reconciliation, not a conflict, and is flagged here so it is not discovered mid-implementation.

      The stub criterion matters because _themes_split and _themes_merge currently advertise themselves as stubs by being thin. Folded into a larger tool alongside eight working ops, that signal is lost unless the description carries it, and an agent calling op=split and getting a recorded-but-not-applied override would have no way to know.


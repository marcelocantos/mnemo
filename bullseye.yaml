  T122:
    name: The daemon drains cleanly on shutdown instead of always exceeding its deadline and force-exiting
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A SIGTERM to an idle daemon completes the drain within the deadline and logs the clean-close path (wal checkpoint on close), not "drain exceeded deadline; forcing exit". Oracle: stop the daemon and grep the log for the checkpoint line.'
    - 'A SIGTERM issued while a mirror reconcile, compaction scan or image backfill is in flight still drains cleanly: in-flight work is cancelled or awaited within the deadline rather than the process being killed. Oracle: send SIGTERM immediately after a reconcile starts and confirm a clean drain.'
    - The drain deadline is justified by measurement rather than assumed — whatever value it takes, the slowest legitimate shutdown path is known and fits inside it, or is explicitly cancelled rather than waited on.
    - Whatever remains genuinely un-cancellable at shutdown (e.g. a gh subprocess mid-flight) is killed deliberately, so the deadline is a backstop rather than the normal path.
    context: |-
      Found 2026-07-27 while chasing a 2.3 GB WAL. Every shutdown in this session — 10 of 10 across all daemon runs — ended in "drain exceeded deadline; forcing exit (crash-only recovery on next start) deadline=10s". Zero clean drains, and consequently zero executions of the Close() path.

      That has a concrete cost beyond untidiness: Store.Close() is the ONLY caller of Checkpoint() (wal_checkpoint(TRUNCATE)), so the WAL truncation path never ran once. The -wal therefore sat at its high-water mark of 2.3 GB against a 21 GB database. It also means every start is a crash recovery, replaying the WAL rather than opening a clean database.

      The 10s deadline looks optimistic for this workload. Candidates for what overruns it: the mirror reconcile spawns gh subprocesses per repo (a reconcile logged 1s before the drain in the observed case); the compaction candidate scan runs 2s+ and up to 2m14s under load; image OCR spawns a worker subprocess per image; and several backfill goroutines may not observe context cancellation at all. Diagnosis should establish which of those actually holds the drain rather than raising the deadline blindly.

      Note the WAL symptom itself is separately mitigated: journal_size_limit is now set and a periodic truncating checkpoint runs during write lulls, so reclamation no longer depends on a clean shutdown. This target is about the drain being broken in its own right.
    tags:
    - shutdown
    - reliability
    - wal
    - lifecycle
    origin: WAL investigation, 2026-07-27
    discovered: 2026-07-27
    achieved: 2026-07-27
  T123:
    name: The two failure modes that were invisible to CI — a worker outrunning a deferred schema upgrade, and a shutdown that never checkpoints — are caught by automated tests rather than by watching a live daemon
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - A test opens a store whose schema is behind, so the upgrade is genuinely deferred, and asserts that a worker gated on AwaitSchemaUpgrade observes the post-migration schema — i.e. a read of a newly-added column/table succeeds after it returns. The test must fail if the gate is removed.
    - A test asserts Registry.Close completes within its grace and still closes the store when a worker goroutine refuses to exit (standing in for the un-cancellable gh/git subprocesses), so the WAL checkpoint is reached. The test must fail if the bounded wait reverts to an unconditional Wait().
    - 'A test asserts the HTTP drain does not hang on a long-lived request: with a handler that never returns (standing in for the streamable-HTTP MCP transport), intake shutdown gives up after its grace and the connection is force-closed.'
    - The suite runs in the normal `go test -tags sqlite_fts5 ./...` pass with no daemon, no network and no built binary required.
    context: |-
      Filed 2026-07-28 after auditing the session's own work. 67 test functions were added across 🎯T64.11/T116/T117/T118/T120/T121/T122 and the WAL fixes, much of it fault-injecting (SIGABRT-raising OCR worker, failing embed helper, PATH-emptied resolver). Two gaps stand out because they cover the bugs that actually recurred or hid longest.

      (1) Deferred-schema-upgrade ordering has NO test, and the bug bit twice in one session: the span backfill read topic_segments.compaction_id, and the image embedder wrote image_embedding_attempts, both before the deferred migration had created them. 🎯T114.1 defers the upgrade so the daemon can serve during a multi-minute pre-migration backup, so any worker touching new schema must wait on AwaitSchemaUpgrade. It only manifests on an UPGRADE boot — a fresh test database always has the new schema — which is exactly why CI cannot see it today.

      (2) The drain path has NO test. Store.Close is the only caller of the WAL checkpoint and it never executed once in this session's 11 shutdowns; the breakage was silent for the whole life of the feature and was found only by reading a live daemon's log. Both causes are unit-testable without a daemon: Registry.Close must not block unconditionally on workers that cannot be cancelled, and HTTP intake shutdown must not wait forever on a long-lived request.

      Verification for both was manual this session (SIGTERM a live daemon, read the log), which is precisely the kind of oracle that does not survive into CI.

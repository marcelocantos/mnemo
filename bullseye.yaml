  T143.2:
    name: One op-dispatch convention governs every consolidated tool, so a folded subsystem is not three different designs
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    attestation: internal/tools/opdispatch.go defines the convention normatively; six tests in opdispatch_test.go pass. Rule 2 (unknown/missing op names the valid ops) and rule 3 (per-op parameter validation REJECTS a foreign parameter and points at the op that owns it) each have a dedicated test; rule 4 is enforced by TestDescribeCoversEveryOp, which asserts the description is generated from the dispatch table so the two cannot drift. Applied to four real subsystems in the same change (🎯T143.3/.4/.5), so it shipped proven rather than as a document. The when-NOT-to-consolidate section is written with mnemo_search (55% of all calls) as the standing counter-example, and it was applied rather than merely stated — mnemo_status and mnemo_stats were kept out of mnemo_ops on exactly that reasoning.
    acceptance:
    - 'A single documented convention covers op-dispatched tools: how the op is named and validated, how per-op parameters are declared and rejected when they belong to a different op, what an unknown op returns, and how the description enumerates the available ops so an agent can discover them without trial and error.'
    - 'An unknown or missing op fails with an error naming the valid ops, not a generic schema violation. Oracle: a test asserts the error text lists them.'
    - Parameters are validated per op rather than unioned into one permissive bag. A parameter valid for op A and passed to op B is rejected, not silently ignored — silent acceptance is how a consolidated tool becomes harder to use correctly than the narrow tools it replaced.
    - The convention is applied to at least one real subsystem in the same change, so it ships proven rather than as a document.
    - 'Consolidation is capability-preserving by construction: the convention includes a pattern for asserting the pre-change operation set still resolves, which the per-subsystem targets each instantiate.'
    - The convention states when NOT to consolidate — a high-traffic tool with a distinct schema loses more in discoverability than it saves in surface, and mnemo_search at 55% of all calls is the standing example.
    context: |-
      Contract-first node for 🎯T143's consolidation half.

      Three subsystems are folding at once (vault 10 tools, threads 5, notes 3, admin 6). Left to themselves that is three or four independently-invented dispatch designs, differing in how the op is spelled, what happens on an unknown op, and whether stray parameters are rejected or ignored — and an agent would have to learn each one. Filing the convention as its own node and blocking the applications on it is cheaper than reconciling four designs afterwards.

      There is prior art in the repo to follow rather than invent: mnemo_config already dispatches on op=read|write, and mnemo_vault_migration_doc takes a write boolean that is really a mode selector. The convention should be recognisably the same thing generalised, not a new idiom.

      THE RISK THIS NODE EXISTS TO MANAGE. Consolidation trades discoverability for surface area, and the trade is not free. Ten narrow tools with ten descriptions are more discoverable than one tool with ten ops buried in a description — an agent scanning names sees vault_recluster but has to read prose to find op=recluster. That is an acceptable trade for a subsystem nobody calls (the whole vault group has zero agent calls) and a bad one for a subsystem in constant use. Hence the last criterion: the convention must say where it does not apply, or the next consolidation will reach for mnemo_search.

      The per-op parameter validation criterion is the one most likely to be skipped under time pressure and most likely to hurt: a union-of-all-parameters schema makes every op's signature look identical, so an agent cannot tell from the schema which parameters its chosen op actually honours, and a wrong guess fails silently rather than loudly.

      Achieved 2026-08-07: internal/tools/opdispatch.go defines the convention normatively; six tests in opdispatch_test.go pass. Rule 2 (unknown/missing op names the valid ops) and rule 3 (per-op parameter validation REJECTS a foreign parameter and points at the op that owns it) each have a dedicated test; rule 4 is enforced by TestDescribeCoversEveryOp, which asserts the description is generated from the dispatch table so the two cannot drift. Applied to four real subsystems in the same change (🎯T143.3/.4/.5), so it shipped proven rather than as a document. The when-NOT-to-consolidate section is written with mnemo_search (55% of all calls) as the standing counter-example, and it was applied rather than merely stated — mnemo_status and mnemo_stats were kept out of mnemo_ops on exactly that reasoning.

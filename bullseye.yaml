  T140:
    name: Budget and throttle state is pushed when it changes and readable from the tool that owns spend, not only from a health check someone has to go and read
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'CARRIED FORWARD FROM 🎯T136 (its ''Throttling is LOUD'' criterion, whose push half was never built): a throttle ENGAGING or LIFTING notifies, rather than only appearing as a warn row. budget.throttle returns diag.Warning and the notifier''s default threshold is Fail (internal/diag/notify.go:75, gated at Observe''s `sev >= n.threshold`), so a throttle produces no OS notification, no `alert` SSE event and no menubar banner. Oracle: engage a throttle in a test and assert an Alert with Kind=fail is emitted, and a recovery Alert on lift.'
    - 'The mechanism chosen distinguishes this case from budget.projection, which is warn-only ON PURPOSE — mnemo cannot stop observed spend, and alerting every pass about an unstoppable condition is how an alert becomes something dismissed reflexively. A throttle engaging is the opposite: discrete, self-inflicted, actionable. Whatever ships must not drag projection''s severity up with it.'
    - mnemo_budget reports the current throttle level, reason, since, and which classes are paused or delayed — the same content Governor.Describe() already produces. It reports governed_usd today, so it says how much spend IS gateable while staying silent on whether the gate is currently shut. An agent asking 'am I being throttled?' should not have to know to call mnemo_doctor instead.
    - 'The dashboard has a budget surface of its own, not only a row in the generic health list: cap, spend vs elapsed, projection, exhaustion date, and a visible throttle state. This needs an endpoint — there is no /api/budget, /api/throttle or /api/agent_trees today, so the dashboard cannot render any of it however it is styled. Oracle: the dashboard shows a throttled state with no health panel expanded.'
    - 'CARRIED FORWARD FROM 🎯T86 (its ''token/cost for the thread (mnemo_usage)'' candidate): the menu-bar popup surfaces spend and throttle state. Owned here rather than there because it is the same daemon endpoint and the same push semantics as the dashboard criterion above, and splitting one feed across two targets is how two surfaces end up disagreeing. 🎯T86 keeps every non-cost candidate and its catalog/triage structure.'
    - budget.projection and budget.throttle have tests. Neither has any today (grep over *_test.go for either name returns nothing), and they are the only place throttle state is visible — the checks most load-bearing for 🎯T136's honesty requirement are the ones with no oracle.
    - 🎯T137's agent trees are reachable from a surface, not only the MCP tool. A fan-out of forty modest agents is the failure the tool was built to see; nothing shows it unless an agent thinks to ask.
    - 'A CLI twin exists for the no-agent-running case, consistent with `mnemo resume` / `mnemo diagnose`: reading spend and throttle state should not require an MCP client.'
    context: |-
      Raised by Marcelo 2026-07-30, reviewing what 🎯T135/🎯T136/🎯T137 (PR #178) left on the observability side: "Did we enhance monitoring, dashboard features, informational tool calls, etc., to accommodate the new agent controls we recently implemented?"

      Investigation says: the INFORMATION all exists and is good. Governor.Describe() (internal/throttle/throttle.go:321) already produces level, reason, since, per-class paused/min-delay, and what lifts it. mnemo_budget carries governed_usd/governed_pct, culprits resolved to repo/cwd/pid, unpriced_models, uncounted, priced. mnemo_doctor and GET /health carry budget.projection and budget.throttle, and both the dashboard health panel and the menubar app inherit them through the existing `health` SSE plumbing with detail + remediation.

      What is missing is DELIVERY, in three specific ways.

      1. Nothing is pushed. 🎯T136's acceptance says "Throttling is LOUD: mnemo_doctor and the dashboard show the reason, the current rate, and what would lift it. A silent throttle is indistinguishable from a hang." The letter of that is satisfied — both do show it. The intent is not: budget.throttle returns diag.Warning, DefaultNotifierConfig sets Threshold: Fail, and Notifier.Observe only emits at `sev >= n.threshold`. So the state transition that the criterion's own rationale is about — a throttle engaging, where the failure mode is someone diagnosing a hang and restarting the daemon — arrives as a yellow row in a panel nobody has open.

      2. The tool that owns spend does not report the control. mnemo_budget says how much spend is gateable and stays silent on whether the gate is shut. That is the same observation/control asymmetry 🎯T136 identified as its premise, reproduced inside the reporting surface.

      3. The dashboard cannot show any of it. It has cost-by-model / by-repo / daily cards off /api/usage, and no cap, projection, throttle or agent-tree surface — and no endpoint to build one against. /api/budget, /api/throttle and /api/agent_trees do not exist.

      Plus two hygiene items with real consequences: neither new diag check has a test, which under the standing "an oracle is a loop, not an artifact" rule is the wrong place to have no coverage; and there is no CLI twin, so spend and throttle state are unreadable without an MCP client.

      LINEAGE, on Marcelo's instruction 2026-07-31. Two criteria here are carried forward from other targets rather than newly invented, and each is named as such in the acceptance list so the ledger shows where the obligation came from.

      - From 🎯T136 (achieved 2026-07-29): the push half of its "Throttling is LOUD" criterion. T136 stays achieved — its control machinery, ordering, hysteresis, durability, partial-coverage honesty and trustworthy-number refusal all shipped and are all verified. What did not ship is the notification on transition, and that obligation now lives here rather than as an unstated shortfall inside a retired target.
      - From 🎯T86: its "token/cost for the thread (mnemo_usage)" candidate. T86 is NOT retired — that candidate was one of eleven in its list, and its catalog / triage / implement / human-gate structure and every non-cost candidate remain untouched and unstarted.

      Scope boundary with 🎯T86 going forward: this target owns the daemon-side endpoints, the push semantics, and every surface that renders spend or throttle state (dashboard, popup, CLI, tools). T86 owns what the popup chooses to show about threads for everything that is not spend.

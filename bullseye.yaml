  T64.10:
    name: Sessions are segmented into hierarchical, overlapping topic spans that feed the clustering engine as a message-level corpus, so a search hit expands to its enclosing conversation and a theme resolves to its spans across sessions
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 8.0
    acceptance:
    - A segmentation pass produces topic_segments rows with nested (parent_id/level) and, where warranted, overlapping intervals; Tier 1 (structural) is the default and runs with zero egress and no stored vectors.
    - Segments participate in clustering as doc_kind='segment' and appear as theme_members; each segment has exactly one primary theme and zero-or-more secondary themes above the similarity threshold.
    - themes.parent_theme_id/depth are populated from the retained dendrogram; a theme's ancestors/descendants are navigable (flat-themes non-goal reversed).
    - mnemo_search expand="segment" returns the smallest enclosing sealed segment and expand="segment:coarse" the top-level span; expand="none" is byte-identical to today.
    - mnemo_segments answers by-session, by-theme, by-containing-message, by-FTS, and overlaps_theme (intersection) queries; a theme resolves to its segments time-ordered across sessions/repos.
    - Incremental re-ingest never rewrites a sealed segment; segment_scan_state advances only past sealed spans (seal-on-lookahead).
    - Embedding-drift and LLM labelling are each opt-in per T63 (never active on API-key presence alone); with both off the pass makes zero outbound calls.
    - Boundary quality clears a Pk/WindowDiff bar on a golden hand-segmented set before expand="segment" is enabled by default.
    - All schema changes pass under sqlift AllowNone (pure CREATE + nullable ADD COLUMN).
    context: 'The message-level extent dual of T64.8''s document-level clustering. Motivated by the code-search analogy: a hit should expand to its enclosing topic-coherent span (function → class → file), not ±N lines. Design: docs/design/topic-segmentation.md. Adds a new corpus kind `segment` produced by an upstream segmentation stage; segments cluster into themes via the same Engine A/B pipeline (one engine, two extents). Extent hierarchy from multi-scale boundary detection; theme hierarchy by RETAINING the agglomerative dendrogram — explicitly reversing T64.8''s "themes are flat" non-goal (vault-clustering.md:81). Overlap is native: arbitrary intervals + primary/secondary theme membership. All schema changes are additive under sqlift AllowNone (new topic_segments/FTS/watermark tables + nullable columns on themes/theme_members; message vectors ride existing cluster_embeddings). Tiers mirror the parent egress posture: structural (always on) → lexical/embedding drift (opt-in) → LLM label (opt-in).'
    depends_on:
    - T64.8
    tags:
    - segmentation
    - themes
    - search
    - hierarchy
    - clustering
    origin: manual
    discovered: 2026-07-01
    achieved: 2026-07-25
  T64.11:
    name: 'Topic segmentation is an enrichment of the summarisation engine: the compactor''s LLM pass emits per-session span documents (boundaries + labels + summaries) that search indexes directly, and global clustering is off the hot path'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The compactor's LLM pass also emits topic spans ({from,to,label,summary} anchored to message ranges) for each window it summarises; spans are persisted as additive schema under sqlift AllowNone (no destructive change to topic_segments/themes).
    - 'ClusterSealedSegments is no longer invoked from ingest, SegmentAllSessions, or the live-segment debounce path; the themes/theme_members dendrogram schema goes dormant (no writes on the hot path). Oracle: grep/test asserts no call sites on the ingest path, and a soak run shows no theme rewrites.'
    - Structural segmentation remains the always-on provisional layer for sessions not yet compacted; once the compactor emits spans for a range, those spans supersede structural ones for retrieval in that range.
    - mnemo_search expand="segment" and mnemo_segments resolve from compactor-emitted spans when present, falling back to structural spans; expand="none" remains byte-identical to today.
    - 'Thematic retrieval is a search problem over span documents: span label/summary text is FTS-indexed and a query returns matching spans across sessions ranked by score, with no dependency on precomputed themes.'
    - 'Daemon CPU stays bounded during backfill: a full segment backfill run completes without the O(n^3) recluster pass; profile shows no ClusterSealedSegments frames.'
    context: 'Pivot from T64.10''s shipped design, decided in the Grok session of 2026-07-25 (session 019f6ab2, topic grok:grok-build-plan). Findings: (1) ClusterSealedSegments — single-link agglomerative over all sealed segments with full delete-and-rewrite per pass — is roughly cubic in sealed-segment count and pegged the daemon CPU during backfill; (2) cross-session theme clustering is not needed for the product goal — thematic/semantic search is a search-engine problem over per-session span documents; (3) LLM span-finding is the same job the compactor already does (read a contiguous transcript chunk, emit structured JSON with message-range anchors), so it folds into summarisation rather than standing up a second LLM pipeline — reusing the compactor''s watcher, newest-first ordering, budget, quarantine, and cursor machinery. This deliberately reverses the topic-segmentation.md non-goal separating compaction spans from topic segments. Structural segmentation stays as the zero-egress provisional sketch; the dendrogram/theme machinery becomes dormant future analytics, not the retrieval substrate.'
    tags:

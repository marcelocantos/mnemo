      Diagnosed and largely fixed 2026-07-28, prompted by Marcelo asking whether the correct tag could be inferred from the jsonl path. It can — decisively — and that is now the mechanism.

      Root cause. session_meta.source is written only at ingest time, and ingest is offset-based: once a file is fully consumed it is never re-parsed, so a wrong source is never repaired. Codex ingest and the source column landed together (🎯T99, commit cbb824e, 2026-06-30). Anything consumed before that went through ingestFile — the Claude-format path — which upserts session_meta WITHOUT a source column, letting the schema default 'claude' stand, and derives the session id from the FILENAME STEM. For a Codex rollout that yields rollout-<ts>-<uuid>, a phantom that duplicates the real uuid-keyed session and holds no messages. The mis-tagged example's transcript starts 2026-06-20, ten days before the feature existed.

      Scale is larger than first thought: 182 of 527 sessions under ~/.codex are tagged claude (35%), not the single case that surfaced it. Grok is clean (371/372). The 4 phantoms are all files that exist in BOTH ~/.codex/sessions and ~/.codex/archived_sessions — Codex moved them and mnemo ingested each path.

      Why it matters beyond tidiness: 🎯T125 resume branches on source, so 182 Codex sessions would be handed to `claude --resume` — the wrong agent, silently.

      Implementation note worth keeping: the repair walks ingest_state (hundreds of rows) rather than session_meta (31k). A verification query written the other way round — joining session_meta to ingest_state with LIKE — did not finish in two minutes.

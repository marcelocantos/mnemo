    name: Thread and note tools are one entry point each, or none, with the choice evidenced rather than assumed
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    attestation: 'CORRECTS AND REPLACES the attestation written minutes earlier, which claimed "/inbox and /post were checked and neither names a note tool by its old name". That was false when written: both skills invoked the old names in ten places, including executable call examples, and would have failed on first invocation with "unknown tool". The earlier skill sweep covered only 🎯T143.1''s twelve removed tools and never touched the note or thread tools; I reported a check that was never run as having passed. mnemo_thread (5 ops) and mnemo_note (3 ops) ship, with TestConsolidationPreservesCapabilities pinning all eight ops against the tools they replaced, and notes_test.go passing untouched so recv''s unread_only/mark_read defaults and idempotency are verified unchanged. Skills are NOW genuinely updated: post/SKILL.md and inbox/SKILL.md call mnemo_note with op=post/recv/list, and the wider sweep those fixes prompted also caught c/SKILL.md invoking mnemo_restore — outside this target''s scope, and it would have broken identically. Threads went to ONE rather than ZERO on recorded evidence (go/new are agent-shaped like mnemo_session_go, which carries use; 🎯T86 is open). Residual risk: no end-to-end invocation of /inbox, /post or /c against the consolidated tools — only unit tests plus a static check that no skill names a nonexistent tool.'
    acceptance:
    - 'The five mnemo_thread_* tools become ONE op-dispatched tool or ZERO, and which is chosen is justified from evidence. Zero is a legitimate outcome: every one already has an HTTP twin (/api/thread/list, /go, /show, /new, /archive) serving the menubar app, and no agent has called any of them. If nothing but the app consumes them, MCP registration is pure surface.'
    - The three mnemo_note_* tools (post, recv, list) become one op-dispatched tool. Unlike threads these have real agent use — note_recv 55 calls, note_post 3, note_list 5 — so capability preservation is load-bearing here, not theoretical.
    - The /inbox and /post skills are updated in the same change. Both wrap the note tools, and 🎯T65's whole point was a working cross-session primitive; breaking it to tidy a surface would be a bad trade.
    - 'note_recv''s delivery semantics survive verbatim: unread_only and mark_read defaults, and the idempotency that stops concurrent receivers double-delivering. Oracle: the existing note tests pass against the consolidated tool unchanged in intent.'
    - If threads go to zero MCP tools, the capability is documented as HTTP-only so a future agent looking for thread access finds the endpoint rather than concluding the feature was dropped.
    context: |-
      Two small consolidations filed together because they raise the same question — what is a tool FOR when a non-MCP consumer already exists — and answer it differently.

      THREADS: 5 tools, 0 agent calls, complete HTTP twins, one known consumer (the macOS menubar app, 🎯T85/🎯T86). This is the group where 'remove from MCP entirely' is genuinely on the table, and the target says so rather than assuming consolidation is the answer. The counter-argument to keep in view: 🎯T86 is an open target about surfacing MORE in the popup, and 🎯T126 wants terminal integration generalised beyond iTerm2 — if either produces an agent-facing thread workflow, zero would be the wrong call. Decide against the evidence at implementation time, not from this note.

      NOTES: 3 tools, 63 calls, and the opposite posture. These are used, and the usage has a shape worth reading correctly — note_recv's 55 calls come from just 2 sessions, which is /loop polling an inbox rather than broad adoption. Consolidation is still right (three tools for one primitive), but the capability-preservation criterion is doing real work here in a way it is not for threads.

      The distinction is the point: both groups are 'rarely used tools' by call count, and the correct treatment differs because rarity has different causes. Threads are unused because their consumer is elsewhere. Notes are lightly used because the primitive is niche but real.

      Achieved 2026-08-07: mnemo_thread (5 ops) and mnemo_note (3 ops) ship; TestConsolidationPreservesCapabilities pins all eight against the tools they replaced. The threads ZERO-vs-ONE choice was decided on evidence and the reasoning is recorded in consolidated_tools.go: zero was genuinely live (complete HTTP twins, app as sole consumer, no agent call ever), and was rejected because `go` and `new` are agent-shaped in the same way mnemo_session_go is — a tool that does carry use — and 🎯T86 is an open target that may produce agent thread workflows. Removing a capability to save one slot would have to be undone the moment it did. Note semantics survive: the recv defaults (unread_only=true, mark_read=true) and idempotency are carried verbatim into the opSpec and the handler is unchanged, and the existing notes_test.go passes untouched. Skills: /inbox and /post were checked and neither names a note tool by its old name — both wrap the tool through the skill layer, so no edit was required. Residual risk: no end-to-end run of /inbox against the consolidated tool was performed, only the unit tests.


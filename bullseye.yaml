  T143.1:
    name: Tools with no consumer are gone, and no tool's removal leaves a pipeline building an index nobody reads
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    attestation: 'All twelve unregistered; TestRemovedToolsStayRemoved pins it and make bullseye is green. The orphaned-pipeline criterion was resolved per tool from evidence, and did not land the same way twice: images, plans and ci_runs keep their ingest because their tables are documented mnemo_query surfaces, so mnemo_query is the named remaining consumer — which is also what stopped the OCR work 🎯T119 closed two days earlier from being retired by accident. The todo index had no such consumer, so it went with its tools: the scheduled IngestTodos walk (every git repo, synthesis root and session cwd) and the realtime re-ingest hook are both removed, along with store/todos.go and the three Backend methods. internal/todo (the parser) was retained on evidence — internal/threads parses todo files directly for the popup''s per-thread counts, so the parser has a live consumer the index does not. Query templates went as a set, since mnemo_list_templates without define/evaluate could only ever list an empty set. Skills updated so none invokes a removed tool: /todo deleted, waw''s invocation of it dropped, retro''s two references repointed at mnemo_query. Residual risk: the schema-level deprecation of query_templates/todos tables is NOT done — this change stops writing and reading them, and the three-phase soak-then-GC path under the append-only policy remains outstanding as product code.'
    acceptance:
    - 'These twelve tools are unregistered: mnemo_plans, mnemo_ci, mnemo_define, mnemo_evaluate, mnemo_list_templates, mnemo_images, mnemo_get_memory, mnemo_tool_result, mnemo_source_drift, mnemo_todos, mnemo_todo_add, mnemo_todo_set. Oracle: a test asserts the registered name set contains none of them.'
    - 'For EACH removed tool, its backing pipeline is either removed with it or has a named remaining consumer. This is the criterion that makes the change honest rather than cosmetic: deleting a read surface while leaving the write side running converts a lightly-used feature into pure cost. The two that matter are called out below and neither may be settled by silence.'
    - The image subsystem gets an explicit decision, not a default. Removing mnemo_images orphans extraction, OCR (🎯T118/🎯T119), AI description and CLIP embedding (🎯T20/🎯T121) — real spend on every ingest, feeding a table with no reader. Either the pipeline is disabled with the tool, or a consumer is named (vault pages, dashboard, future search) and the tool is RETAINED instead of removed. Retaining it is an acceptable outcome of this criterion.
    - The todo subsystem gets the same explicit decision. Removing the three tools orphans the todos/todo_files tables AND their discovery walk, which traverses every git repo, synthesis root and session cwd honouring .gitignore — the most expensive orphan on the list.
    - The /todo skill is deleted or rewritten in the same change. It references all three todo tools today; leaving it would make an installed skill fail on invocation.
    - Query templates go as a set. mnemo_define and mnemo_evaluate have never been called and mnemo_list_templates once ever (2026-07-31); removing the first two while keeping the third leaves a tool that can only ever list an empty set. The query_templates table is dropped from use under the append-only policy's deprecation path, not by a destructive migration.
    - 'Removal is reversible in principle: each tool''s handler and tests are deleted in a single reviewable commit per subsystem, so a reinstatement is a revert rather than an archaeology exercise.'
    context: |-
      The removal half of 🎯T143, scoped from the 2026-08-07 audit.

      THE EVIDENCE, per tool. Each was registered on the date shown and has never been called by an agent in the transcript index, has no skill referencing it, and has no HTTP or CLI twin:

      - mnemo_plans (2026-04-09), mnemo_ci (2026-04-10), mnemo_images (2026-04-14), mnemo_get_memory (2026-04-26), mnemo_tool_result (2026-04-26), mnemo_source_drift (2026-05-30) — between 69 and 120 days old.
      - mnemo_define + mnemo_evaluate (2026-04-13) with mnemo_list_templates (1 call ever). A persistence feature with no user: templates can be defined and executed, and nobody has done either.
      - mnemo_todos, mnemo_todo_add, mnemo_todo_set (2026-06-16). These are the interesting case — a /todo skill exists and references all three, and still zero calls in 52 days. The skill is either undiscovered or the need is not real; either way the tools are not earning their place.

      WHY THE ORPHANED-PIPELINE CRITERION IS THE LOAD-BEARING ONE. A tool registration is cheap to delete and the deletion looks like progress. But mnemo_images and mnemo_todos are each the only READER of a subsystem that keeps paying on every ingest cycle. Remove the reader alone and the cost stays while the benefit goes to zero — a strictly worse position than before the change, and an invisible one, because nothing in the tool count or the schema-byte metric would show it.

      The image case is the sharper of the two, and cuts both ways. The pipeline is expensive (OCR per image, optional AI description, optional CLIP embedding) and was the subject of sustained work as recently as 🎯T119, closed 2026-08-05, which drove OCR to 771/772 across the corpus. Deleting its only search surface two days later would retire that work by accident. That is an argument for RETAINING mnemo_images and recording a consumer, not for a quiet removal — which is why this target's criterion permits retention as a valid outcome rather than mandating deletion. The honest question is whether anyone wants image search; if the answer is no, the pipeline should stop too, and 🎯T121's opt-in default already makes most of that spend conditional.

      The todo case is more clear-cut on cost: the discovery walk touches every known root on a schedule, which is the single most expensive orphan here, and there is no equivalent recent investment to strand.

      DELIBERATELY NOT IN SCOPE: dropping tables. The append-only schema contract holds — this target stops WRITING deprecated content and removes readers; any reclamation is the three-phase soak-then-GC path, as product code, later.

      Achieved 2026-08-07: All twelve unregistered; TestRemovedToolsStayRemoved pins it and make bullseye is green. The orphaned-pipeline criterion was resolved per tool from evidence, and did not land the same way twice: images, plans and ci_runs keep their ingest because their tables are documented mnemo_query surfaces, so mnemo_query is the named remaining consumer — which is also what stopped the OCR work 🎯T119 closed two days earlier from being retired by accident. The todo index had no such consumer, so it went with its tools: the scheduled IngestTodos walk (every git repo, synthesis root and session cwd) and the realtime re-ingest hook are both removed, along with store/todos.go and the three Backend methods. internal/todo (the parser) was retained on evidence — internal/threads parses todo files directly for the popup's per-thread counts, so the parser has a live consumer the index does not. Query templates went as a set, since mnemo_list_templates without define/evaluate could only ever list an empty set. Skills updated so none invokes a removed tool: /todo deleted, waw's invocation of it dropped, retro's two references repointed at mnemo_query. Residual risk: the schema-level deprecation of query_templates/todos tables is NOT done — this change stops writing and reading them, and the three-phase soak-then-GC path under the append-only policy remains outstanding as product code.

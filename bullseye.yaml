    - usage
    - cost
    - observability
    - alerting
    - multi-provider
    origin: manual
    discovered: 2026-07-29
    achieved: 2026-07-29
  T136:
    name: mnemo throttles its own background agents after a soft limit is breached, so unattended work cannot quietly burn a budget
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - Throttling applies to the agents MNEMO ITSELF INVOKES — the compactor, the streaming segmenter, the reviewer, image description — and to nothing else. Not because those are the expensive ones, but because they are the only ones reachable. Work started straight from Claude Code, and the sub-agent storms it spawns, pass through nothing mnemo can gate.
    - The partial coverage is STATED, not implied. A throttle that silently governs a minority of spend while the report shows a rising total invites the conclusion that the throttle is broken. 🎯T135's report must distinguish governed spend from observed-only spend.
    - 'Restriction is POST HOC and soft: a soft limit is breached, the invocation rate drops. Nothing is refused up front and nothing is hard-stopped — which is what keeps it self-contained, with no admission control and no cross-process coordination.'
    - 'It is BUDGET-driven, which is what distinguishes it from 🎯T139''s per-invocation ceilings. 🎯T139 already shipped ErrSpendCeiling on the streaming segmenter and a per-session ratio cap on the compactor: those bound a single runaway. This target bounds the AGGREGATE against a period budget — many well-behaved invocations that collectively overrun. The two compose and neither replaces the other.'
    - 'The throttle order is by TIME-INSENSITIVITY, not cost. Deep-history backfill first: delaying it costs nothing but latency. Recent compaction second. The streaming segmenter is the exception and must be PAUSED rather than slowed — a half-rate live segmenter still pays the ~45k fixed prompt overhead per call while producing spans too late to be fresh, spending the same money for a product whose entire value was timeliness. Batch finalisation covers those conversations at session close, so pausing costs freshness, not coverage.'
    - 'Throttling is LOUD: mnemo_doctor and the dashboard show the reason, the current rate, and what would lift it. A silent throttle is indistinguishable from a hang.'
    - 'Hysteresis: once throttled, the limit must clear by a margin before full rate resumes, so spend hovering at the boundary does not oscillate the system.'
    - 'It is driven by a number that is correct, and REFUSES TO ACT when that number is not trustworthy. 🎯T135 is a hard prerequisite: a throttle keyed to today''s figures would fire on Codex tokens priced with Anthropic rates, or on a corpus over-counted 2-3x by missing deduplication. Where 🎯T135 reports a source as unpriced or uncountable — Codex today — that spend must not silently count toward or against a budget.'
    - State is durable across a daemon restart. A throttle that resets on restart is trivially defeated by the auto-upgrade path, which restarts the daemon on its own schedule.
    context: |-
      Marcelo, 2026-07-28: "we probably should have some sort of control tool in case we have blowouts with backend agents that I have no direct line of sight to, but that can be within mnemo, and can simply throttle agent invocations. It can also work post hoc by applying restriction after soft limits are breached. Since there would be no hard limits, it doesn't require claudia to get involved."

      Then correcting my reasoning: "enforcement cannot live in Claudia because not everything goes through Claudia. Stuff coming straight out of Claude, sub-agent storms Claude kicks off — a lot of work can happen that none of my tools can control. It is what it is. What we can control is agents that mnemo itself invokes directly, and they will be through Claudia, but it's not an argument for controlling things through Claudia. That's just an argument for controlling things through mnemo."

      I had argued enforcement belonged in claudia because it was the single chokepoint every agent crosses. That is false. Claude Code spawning its own sub-agents touches neither claudia nor mnemo, so no amount of instrumentation there would see it. The chokepoint framing reached the right destination — control in mnemo — by an argument that does not hold, and the difference matters, because it changes what this target can honestly claim.

      The real shape is asymmetric: observation is universal (every session leaves a transcript, and mnemo ingests them all), control is partial (only what mnemo invokes), and the user closes the gap when the report tells them to. That asymmetry is not a limitation to be engineered away; it is the premise. The justification for governing mnemo's own agents is the BLIND SPOT — unattended work nobody is watching — rather than any claim to completeness.

      Which makes the honesty requirement load-bearing rather than decorative: a throttle that governs a minority of spend, while the total keeps climbing because Claude Code is spawning sub-agents nobody gated, will look broken unless the report separates governed from merely-observed.

      WITNESS — the parts exist.

      1. mnemo already invokes every agent this governs through a small number of paths: internal/compact, internal/streamseg, internal/reviewer, and the image description worker. Each runs under a scheduler this can gate.

      2. 🎯T84 already implements a circuit breaker for repeatedly-failing background tasks — halt, back off, resume. This is that mechanism with a different trigger, and its backoff gives hysteresis for free.

      3. 🎯T83's health pipeline is where the state becomes visible, carrying severity, remediation text and a dashboard deep-link.

      4. 🎯T135 supplies the number, and is a genuine prerequisite rather than a nicety.
    depends_on:
    - T135

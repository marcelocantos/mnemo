  T132:
    name: A claudia-maintained streaming watcher summarises live sessions into provisional topic spans, replacing the structural layer in retrieval, with batch finalization superseding them
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A claudia-driven watcher consumes drip-fed substantive messages from a live session and emits idempotent JSONL span events (open, seal, reopen, supersede) as method=''stream'', crash-recoverable from the last sealed state. DONE — with one correction to the design: it runs one claudia TASK per drip, not a persistent session. Session mode could not work at all; its Send drives the Claude Code TUI through tmux keystrokes and a multi-KB multi-line drip is detected as a PASTE, which sits in the composer unsubmitted. The persistent-session premise was also unnecessary: the drip already restates the working set every time, so the model was always stateless between drips.'
    - 'The bounded-state contract holds, MEASURED rather than argued. DONE: 4x the messages cost 4.12x the context; the same harness with the bound removed costs 15.68x, 16 being quadratic. Sealed spans are evicted, and the agent re-seeds from the automaton''s state rather than the transcript.'
    - Batch finalisation at session close redraws spans with hindsight and supersedes divergent stream spans; the stream-vs-final boundary diff is recorded as the freshness-cost metric. DONE — supersession by OVERLAP rather than containment, since a span straddling the window edge was still drawn without hindsight; and the metric costs nothing to compute because the loser is retained rather than deleted.
    - Supersession edges exist in the schema and retrieval ranks or flags superseded spans. DONE (🎯T132.1), as a nullable column under sqlift AllowNone, verified against a database built from the previous schema. Kept distinct from parent_id, which is hierarchy — conflating them would let a search expansion present a correction as the surrounding conversation.
    - 'The model/drip/K sweep is completed and the operating point documented with measured cost. DONE (🎯T132.4): sonnet / drip 12 / K=3, now the defaults. The effort axis was unavailable — claudia''s TaskConfig exposes no effort setting.'
    - The live tail of an active session shows stream spans with real topic labels. DONE in mechanism and verified end-to-end against a real claudia task; the watcher is opt-in and off by default, since enabling it runs a summariser per live session.
    - 'MOVED to 🎯T138 — ''structural spans no longer appear in retrieval''. The retirement mechanism exists, is tested, and runs against history (1,343 spans demoted on the live index), but it is correctly GATED: structural spans retire in favour of llm coverage and not stream, because stream spans score 0.445 against a 0.555 naive baseline and do not clear the stated bar of 0.40. Displacing a tier with one that has not beaten it would be a regression dressed as progress. Raising that quality is its own desired state, not a criterion of building the watcher.'
    - MOVED to 🎯T138 — label and summary quality judged separately from boundary placement. Today a correct boundary with a useless label scores the same as a misplaced one.
    context: 'Design from the 2026-07-28 segmentation-baseline discussion (CSP session fork). The batch pipeline''s windows are cut by token budget and never re-summarised, so a topic straddling a window boundary can never be one span, and no window ever sees another — cross-window semantics (supersession edges, callbacks to earlier topics) are structurally impossible in batch. A long-running low-effort summariser session (driven via ../claudia) watching the live transcript dissolves both: it closes spans when the conversation closes the topic, and its rolling state lets it emit "this overturns span X" at the moment the overturning happens. Streaming replaces the STRUCTURAL tier (the provisional live-tail layer, whose cadence heuristics were never a segmenter — see the T64.10 provenance discussion), NOT the batch tier: batch finalization at session close redraws spans with hindsight and gets the last word; backfill (🎯T131, in progress) covers history. Critical design commitment: the watcher is a bounded-state streaming automaton — rolling summary + open spans + unsealed tail; sealed spans evicted from context; restart from own emitted state on context budget. The naive accumulate-everything design is QUADRATIC in session length even with prompt caching (0.1× cache-read on a growing prefix per drip still sums quadratically); bounded state makes it linear. Premature sealing is mitigated by a seal-lookahead lag (K substantive messages of different topic before sealing — the structural layer''s lookahead rule finally attached to the right decider). The stream-vs-finalization diff doubles as a free quality metric: where hindsight routinely redraws streaming boundaries, that gap is the measured cost of freshness. Pk/WindowDiff scoring functions already exist in internal/segment/structural.go with nothing to evaluate; the effort/model sweep gives them a job. Expected cost: low single-digit dollars per heavy working day with substantive-message filtering; summarisation is extraction, not hard thinking, so low effort is the prior for the sweet spot.'
    depends_on:

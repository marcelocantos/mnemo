      Requested 2026-07-28: "I often want to resume a conversation, but don't have a session id handy."

      This is much less new work than it looks, because the hard part already exists. 🎯T85.2 built internal/iterm.Go(ctx, GoArgs{Path, Name, NoResume}) — focus-the-tagged-tab-or-spawn-a-new-one running `claude` in a directory — and exposes it as mnemo_thread_go. That machinery is already abstracted behind an overridable runner so it is testable without iTerm2. This target is the same capability keyed on a SESSION rather than a THREAD.

      Two things genuinely differ from thread_go and are where the work is:

      1. It must run a RESUME command, not a bare `claude`. iterm.GoArgs currently has no way to pass a command; loginCommand/spawnCommand build it internally. That needs a seam.

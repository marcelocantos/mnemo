  T130:
    name: The cloud Windows CI job finishes with real margin against its timeout, so its verdict reflects the code rather than runner luck
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Wall-clock has real headroom against the timeout. ACHIEVED: the windows job went ~23m to 4m0s, and internal/store — the package that was hitting the ceiling — went 1055s to 32.9s against a 1200s per-package timeout, a 36x margin. internal/vault 459s to 10.3s.'
    - 'The pass/fail flip is gone. ACHIEVED by margin rather than by repetition: one post-fix run, but at 32.9s against a 1200s ceiling the job cannot flip without a 36x regression, where before it was decided by a 35-second spread (22m42s pass vs 23m17s fail).'
    - 'The cause is named rather than absorbed by raising the timeout. ACHIEVED, and the first named cause was WRONG — recorded because that matters. Defender exclusion was the leading hypothesis; all four exclusions applied cleanly and the job moved 22m42s to 21m25s, inside noise, with a docs-only commit still failing at 23m47s. The real cause is fsync COUNT: schema.sql holds 221 CREATE statements, each running in its own implicit transaction ending in an fsync under default synchronous=FULL, across 183 fresh test stores — ~40,000 fsyncs per run. At the runner''s virtual-disk latency that arithmetic lands on the observed 1055s, which the Defender guess never had. Fixed by batching schema creation into one transaction (internal/store/store.go applyFreshSchema).'
    - The fix costs no durability. One transaction is atomic where 221 were not, so a crash mid-create no longer leaves a half-built schema for sqlift to misread as existing. synchronous deliberately untouched — the fsync count was the problem, not fsync.
    - The local Parallels VM gate (scripts/win-validate.sh) remains the authoritative Windows signal; this target only made the advisory cloud job trustworthy, and did not promote it back to required. UNCHANGED, as intended.
    - 'Corroborated off the runner too: the same change cut internal/store 23.5s to 6.25s and internal/vault 12.9s to 2.47s on an M4 Max, where fsync is supposed to be cheap — so the mechanism is not a runner peculiarity.'
    context: |-
      Discovered during the v0.70.0 release, 2026-07-28.

      The mnemo gate profile (🎯T100) already demotes the cloud Windows job to advisory precisely because it is a 15-18 min CGO/SQLite long pole, and that decision stands. But an advisory job that flips between pass and fail on essentially the same code is worse than a slow one: it trains the reader to ignore it, so a genuine Windows regression would land unnoticed behind a shrug of "that job is always red".

      The two data points are from this release. The pre-release master run failed at exactly the 1200s ceiling; the post-merge master run passed. The 20-minute timeout was itself already a raise — ci.yml carries a comment that the default 10m per-package ceiling "was already running ~9-10m on master before any schema growth", so the ceiling has been chased upward once already and the margin has been eaten again.

      Raising it a third time is the tempting non-fix. The 40x local-to-runner gap is the thing to explain: internal/store runs 30.9s on the dev Mac and exhausts 1200s on the runner. Both create many short-lived SQLite databases via newTestStore, which is exactly the workload Defender's real-time scanning punishes, so that is the first hypothesis to test — but it is a hypothesis, not a diagnosis.

      Related: 🎯T90 (fresh-DB schema creation bypasses sqlift) was an earlier attack on the same surface and did help, but evidently not enough.
    tags:
    - ci
    - windows
    - flaky
    - performance
    - test-infrastructure
    origin: manual
    discovered: 2026-07-28
    achieved: 2026-07-28

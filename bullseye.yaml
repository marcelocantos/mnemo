    context: |-
      Filed 2026-08-07 after an audit of the tool surface against actual usage, at Marcelo's direction ("We'll remove the dead ones and todo. I also want to consolidate rarely used tools into a smaller surface area").

      THE MEASUREMENT. 70 tools are registered in internal/tools/tools.go. Across the whole transcript index (2026-04-06 onward, 2,071 mcp__mnemo__* calls) only 40 have ever been called by an agent, and only 15 were called in the last 30 days. Usage is extremely concentrated: mnemo_search alone is 55% of all calls and the top five are 83%. The remaining 35 tools share 174 calls between them.

      Two readings that a naive count would get wrong, both established during the audit and worth preserving so they are not re-litigated:

      1. 'Never called by an agent' is NOT the same as dead. All five mnemo_thread_* tools have HTTP twins (/api/thread/list, /go, /show, /new, /archive) and back the macOS menubar app; the vault and backup tools are user-initiated maintenance. They have consumers — just not agent ones. What is questionable is whether they need to occupy ten-plus slots in a surface every agent loads.

      2. mnemo_decisions looks like the broadest adoption after search (83 calls, 77 sessions) and is not. 77 of those calls fall in July, roughly one per session, and 69 of the sessions carry no repo attribution — the signature of a single fan-out where each agent called it once. Nothing since 2026-07-16. Read as organic demand it would justify investment; read correctly it is one campaign that never recurred.

      WHY NOW. STABILITY.md's commitment is explicit: backwards compatibility becomes binding at 1.0, and 'the pre-1.0 period exists to get these surfaces right.' mnemo is at v0.83.0. Every tool left in place at 1.0 is one that cannot be removed afterwards without forking the product. This is the window, and it is the last one.

      A NOTE ON WHAT THE COST ARGUMENT IS AND IS NOT. The schema tax is real — 66 KB (~16.6k tokens) total, of which ~23 KB is never-called tools — but it is the weaker argument, because harnesses increasingly defer tool schemas behind a search step (this session received mnemo's tools deferred). The stronger argument is navigability: 30 unused entries make the surface harder to reason about, and mnemo_search absorbing 55% of traffic is plausibly what an agent does when it cannot tell what else is on offer. Do not let a shrinking token cost be read as the target losing its point.


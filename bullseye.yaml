  T23:
    name: File-watch handlers are cheap — heavy work deferred and debounced
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 2.0
    acceptance:
    - fsnotify event handlers do minimal work (mark dirty / enqueue), with no inline parsing, hashing, or DB writes on the event-handling goroutine
    - Burst events for the same path (e.g., editor save followed by formatter rewrite) coalesce into a single re-index via a 200–500ms debounce
    - A flush/worker goroutine drains the dirty queue at a sustainable rate, with backpressure if ingest falls behind
    - Self-heal on startup remains the source of truth — dropping a queued event must never leave the index permanently stale
    - 'Measured: re-indexing cost during a synthetic burst (e.g., 100 rapid touches of one transcript) is bounded to one parse+write, not 100'
    context: 'As mnemo''s watch surface grows (transcripts, git, planned docs/markdown/PDF in 🎯T21, etc.) and as more MCP servers run alongside it, redundant work in response to file events becomes the dominant cost — not the kernel notifications themselves. Two complementary mitigations: (1) keep event handlers cheap by marking files dirty and enqueueing rather than parsing/indexing inline; defer the real work to a background flush, query-time, or startup self-heal (mnemo already does the last of these). (2) Coalesce bursts via a debounce window (200–500ms) so editor save storms, formatter rewrites, and rapid git operations produce at most one re-index per affected file. This protects laptop battery on idle and keeps editor saves snappy on large repos.'

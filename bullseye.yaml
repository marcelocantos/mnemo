    context: The store test suite creates a fresh DB per test (newTestStore is called 123 times across 217 store test functions), and every store.New() ran the full sqlift migration (open + extract + parse the 42 KB schema.sql + diff + apply) through cgo. That cgo+SQLite work is ~45x slower on the Windows CI runner (~1052s) than on macOS (~23s), leaving only ~12% headroom under the 20m go-test timeout. Growing the schema (🎯T65 added a table + FTS + 3 triggers, re-parsed/diffed on every New()) plus normal runner variance tipped the Windows store binary over 20m, blocking the v0.52.0 release. sqlift only earns its keep when upgrading an existing schema; a fresh/empty DB can create the desired schema by executing schema.sql directly. This makes per-test setup and first-run install dramatically cheaper without weakening the upgrade path.

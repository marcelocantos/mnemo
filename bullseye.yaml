    discovered: 2026-07-28
  T134:
    name: Spans record how they were derived, so ones drawn by a method or operating point since improved can be found and redrawn
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A span records enough about its derivation to identify it later: the method already exists, but not the model, effort, drip size, seal-lookahead, or prompt version that produced it. Today two stream spans drawn a year and three operating points apart are indistinguishable in the table.'
    - Spans drawn by a derivation now known to be worse can be ENUMERATED — 'every stream span from before the 🎯T132.4 operating point', 'every structural span in a session that now has llm coverage' — without re-reading transcripts to work it out.
    - 'Redrawing is incremental and interruptible, and never worsens coverage: a span is replaced only once its replacement exists, so a failed or abandoned pass leaves the old span standing rather than a gap.'
    - The cost of a full redraw is knowable before starting it, in the same terms as 🎯T131's cost policy — sessions, messages, and estimated summariser volume.
    - Structural spans in sessions that have since gained llm or stream coverage are the first population this retires, since that is the clearest case of a derivation superseded by a better one.
    context: |-
      Raised by Marcelo 2026-07-28 alongside 🎯T133, from the same question about backfilling spans "no longer considered correct". Two readings, different machinery, so two targets. 🎯T133 is a stale CONCLUSION: the span was drawn correctly and later work proved the claim wrong. This is a stale DERIVATION: the claim may be fine, but a better method now exists.

      The blocker is that derivation is unrecorded. topic_segments carries method and computed_at and nothing else about provenance — no model, no effort, no drip size, no seal-lookahead, no prompt version. After 🎯T132.4 picks an operating point there will be no way to ask which spans predate it, and the only honest answer would be "redraw everything". That is the position 🎯T131 was in for compaction eligibility, and getting out of it cost a full-corpus pass.

      WITNESS — one viable approach, so this is a build target rather than research.

      1. A nullable `derivation TEXT` column on topic_segments, holding a compact stable key: method/model/drip/lookahead/prompt-version, e.g. `stream/sonnet/d12/k3/p1` or `llm/sonnet/p2`. Nullable ADD COLUMN, which sqlift permits under AllowNone, so this stays inside the append-only schema policy with no gate relaxed — the same move 🎯T132.1 made for superseded_by, already proven against a database built from the previous schema. NULL means "drawn before provenance was recorded", which is itself a usable population.

      2. Writers stamp it: PutStreamSpans takes the runner's config, PutCompactionSegments stamps the compactor's model and prompt version. Both already know these values; they simply discard them today.

      3. Enumeration is then a plain query — SELECT derivation, COUNT(*) FROM topic_segments GROUP BY derivation — which both names the populations and prices the redraw before it starts, in the same terms as 🎯T131's cost policy.

      4. Redraw as a reconciler under the 🎯T68 data plane, selecting spans whose derivation is not in the current-best set. Write the replacement BEFORE clearing the old row, so an interrupted pass leaves the old span standing rather than a gap. Idempotent, since span ids are extent-derived.

      5. First population to retire: structural spans in sessions that have since gained llm or stream coverage. That is the clearest case of a derivation superseded by a better one, and it is the mechanism 🎯T132.4's last criterion needs in order to actually remove structural spans from retrieval rather than merely deciding they should go.

      Cheapest useful slice is steps 1-3 alone: recording provenance and being able to name the populations is independently valuable, and it is the part that must exist before any redraw can be scoped at all.

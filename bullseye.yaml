  T120:
    name: The compaction watcher stops paying full candidate-selection cost on every tick when nothing is owed
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'On a continuously-ingesting daemon with an empty owed-set, the per-minute scan does not run the full candidate-selection query. Oracle: over 30 minutes of live ingest, scans logged at WARN (>=5s) drop to zero and total scan CPU is materially reduced.'
    - 'The owed-set stays correct: a session that crosses the addenda-token threshold is still picked up within one scan interval of doing so. Oracle: test drives a session past the threshold and asserts it is selected on the next scan.'
    - 'The mechanism is stated: whatever replaces or augments the 🎯T91 MAX(entries.id) gate must explain why it holds under continuous ingest, since that is precisely when the current gate fails.'
    context: |-
      Observed 2026-07-26 during a T118 health sweep. The compaction watcher scans every 60s and each scan took 2.1-9.3s while returning candidates=0 backlog=0 every single time — 10 scans exceeded the 5s WARN threshold in a 32-minute window. That is a multi-second query over a 21 GB index, once a minute, forever, for no result, plus the SQLite contention it causes against ingest.

      🎯T91 added an idle gate intended to prevent exactly this: skip the expensive scan when MAX(entries.id) is unchanged since the last scan and that scan left nothing owed or quarantined. The gate is sound in principle but never fires in the common case, because ANY transcript append anywhere advances MAX(entries.id) — and on an actively-used machine that is continuous. So the cheap O(1) check almost always says "something changed", and the expensive re-sum of every session's addenda tokens runs regardless, even though the sessions that changed are usually nowhere near the threshold.

      Directions worth considering rather than a fixed design: track the watermark per session rather than globally so only sessions with new entries are re-summed; maintain the addenda token total incrementally at ingest instead of re-aggregating at scan time; or keep a cheap "next session to cross the threshold" bound so the scan can early-exit. Note the compactor itself is healthy — 9132 compactions, 93 in the last 7 days, last one today — so this is pure overhead, not a functional fault.
    tags:
    - compaction
    - performance
    - cpu
    origin: health sweep, 2026-07-26
    discovered: 2026-07-26
    achieved: 2026-07-27
  T121:
    name: Image embedding fetches no model weights from the network unless the user opted in, and a failed embedding is recorded rather than violating a NOT NULL constraint
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A failed embedding records the failure and moves on; it never attempts an INSERT that violates image_embeddings.vector NOT NULL. Oracle: fault-injection test with a script that exits non-zero produces no constraint error and marks the image so it is not retried forever.'
    - 'Model-weight downloads are covered by the documented egress posture: either the embedder is opt-in like cost reconciliation, or CLAUDE.md''s ''External API egress'' section states plainly that enabling image embeddings fetches weights from the HuggingFace Hub on first use. No silent outbound fetch. Oracle: the section names the behaviour and matches the code.'
    - 'Whether the embedder ran or was skipped is visible without reading the log — the reason (no uv, script missing, weights unavailable, disabled) is retrievable. Oracle: a status/diagnostic surface reports it.'
    context: |-
      Observed 2026-07-26 during a T118 health sweep. Two distinct problems in the image embedder (internal/store/image_embeddings.go, which shells out via `uv` to tools/embed-clip/embed.py).

      (1) Undocumented network egress. The logs show "embed script error: Downloading transformers (11.1MiB)" and "Warning: You are sending unauthenticated requests to the HF Hub. Please set a HF_TOKEN to enable higher rate limits and faster downloads." So generating image embeddings pulls model weights from the HuggingFace Hub at runtime. CLAUDE.md's "External API egress" section enumerates Anthropic Admin API (opt-in), GitHub, and federation — it does not mention HuggingFace at all. Given the project's stated posture (defaults are silent; opt-in must be deliberate, for users in environments where unsolicited outbound calls need security review) this is a gap between documented and actual behaviour, and arguably wants the same explicit opt-in as cost reconciliation.

      (2) A failure path that violates the schema. When the script fails or returns no vector, the code proceeds to store anyway and SQLite rejects it: "NOT NULL constraint failed: image_embeddings.vector" (seen for image_id 73 and 166, repeatedly across restarts). So the failure is neither recorded nor suppressed, and the same images are retried on every startup, each attempt costing a subprocess and a download attempt. Contrast image_ocr, which records an error column and is therefore skipped next pass.

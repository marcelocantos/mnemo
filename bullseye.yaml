    - cost
    - throttling
    - observability
    - dashboard
    - notifications
    origin: manual
    discovered: 2026-07-30
  T141:
    name: A short conversation tail is finalised once it goes quiet, instead of waiting forever for a token volume it will never reach
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A session whose un-compacted tail is below the addenda budget but has been idle is compacted, rather than never being compacted at all. Oracle: a store test with a sub-budget tail and a stale last_msg returns the session from SelectCompactionCandidatesSince; the same tail freshly active does not.'
    - The idle requirement SCALES with how far under budget the tail is, rather than being a flat timeout — a tail at 90% of budget waits briefly, one at 5% waits the full window. Volume-only mode (max_idle <= 0) preserves today's behaviour exactly, so the feature is opt-out to a known-good baseline.
    - 'It composes with the 🎯T131 message-count fallback rather than bypassing it. This is the criterion the abandoned implementation failed: it keyed quiescence off a token-only `addenda_tokens` column and gated on `addenda_tokens > 0`, which would have silently excluded every grok and codex session — exactly the sessions 🎯T131 taught the predicate to include. One estimate of tail size must serve both the owed predicate and the idle scaling.'
    - 'The 🎯T91/🎯T120 scan gate is made safe for it. That gate skips the candidate scan when the entries watermark has not moved, which is sound only because every input to the owed predicate is monotone in ingest. Quiescence breaks that: the owed-set grows from wall-clock idle with no new entries. The skip must be disabled whenever quiescence is on, or short quiet tails are stranded by the very optimisation meant to be free.'
    - Spend impact is bounded and stated. This widens what the compactor considers owed, so it interacts directly with 🎯T136's budget throttle and 🎯T139's per-invocation ceilings. A test pins that a repeatedly-idle session is not re-compacted on every scan.
    - The SQL argument list is verified positionally. The abandoned version threaded ~10 new positional parameters through a query that master has since converted to a dynamic args slice; a misordered parameter there is a silent wrong-threshold bug, not a failure.
    context: |-
      Filed 2026-07-31 while cleaning up PR #158, which was opened 2026-07-25 and never merged.

      The feature is real and wanted: today a session whose tail never reaches AddendaBudgetTokens is never compacted at all, so short conversations stay permanently un-summarised. Commit ccdc6bc on branch `fix-targets-index-bullseye` implemented it — quiescence-scaled idle, where the required idle time is `max_idle × (budget − addenda) / budget`, so a nearly-full tail finalises almost immediately and a tiny one waits the full window.

      That commit is NOT being merged, and this target exists to redo it against current master rather than to resurrect it. The reason is not staleness in the abstract; it is a specific, identified defect that a rebase would have introduced silently.

      Master's owed predicate was rewritten after ccdc6bc was authored (🎯T131): a session with no token metadata — every grok and codex session — is now sized by message count × FallbackTokensPerMessage instead of by tokens. ccdc6bc predates that and computes a token-only `addenda_tokens` column, then gates on `AND s.addenda_tokens > 0`. Merged as written, that clause evaluates false for every tokenless session, silently un-doing 🎯T131 for exactly the sessions it was written to rescue. Nothing in the test suite would have caught it: the conflict is in SQL, both sides look reasonable, and the failure is an absence of compactions rather than an error.

      The correct shape is to define ONE tail-size estimate in the CTE — master's CASE (tokens when sess_tokens > 0, else message count × FallbackTokensPerMessage) — and drive both the owed predicate and the quiescence scaling from it. That is a genuine unification and better than either side, but it is design work with spend consequences, not a merge resolution, which is why it is a target rather than a conflict marker resolved under time pressure.

      Two further hazards recorded so the redo does not rediscover them:

      1. The 🎯T91/🎯T120 scan-skip gate must be disabled when quiescence is on. Its soundness argument is that every input to the owed predicate is monotone in ingest; quiescence makes the owed-set grow from wall-clock time alone, so a skip keyed to an unchanged watermark strands precisely the quiet tails this feature targets. ccdc6bc got this right (`w.cfg.maxQuiescence() <= 0` guard) and the reasoning is worth preserving.

      2. Master converted SelectCompactionCandidatesSince to a dynamic `args...` slice for 🎯T120's incremental window. ccdc6bc threads ~10 new positional parameters through the old fixed-arg form. Re-deriving that ordering by hand is how a wrong threshold ships under a green build.

      The rest of PR #158 is resolved: its two health-alert commits (f31cae9, 63b6687) were relanded on master; its README rewrite is superseded by four subsequent README PRs (#160, #162, #164, #179) and would have deleted the upgrade, session-resume and cost-tool sections; its first two commits cancel out (eb0f880 added bullseye-target indexing, 121ec5b reverted it); and its bullseye.yaml delta was stale target state.
    tags:
    - compactor
    - cost
    - sql
    - salvaged-from-pr158
    origin: manual
    discovered: 2026-07-31
  T142:
    name: mnemo daemon never exhausts macOS system vnodes / open-file table under full corpus load
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Root cause of observed ~72k concurrent open FDs (mostly REG+DIR under ~/.claude/projects and ~/.grok/sessions) is identified with a named code path or intentional design choice, not a guess
    - Under a representative full-corpus ingest/watch load on a Mac with default kern.maxvnodes (~263k), steady-state mnemo open-FD count stays bounded (document the bound; target well under 5k unless justified) and kern.num_vnodes does not climb to 100% solely due to mnemo
    - 'If a leak or unbounded open-every-file walk is found: fix lands with a regression test or stress oracle that fails if FD count grows unboundedly during corpus walk/watch'
    - 'If intentional: design is documented (what is held open and why), plus a hard safety limit and fail-soft behaviour so mnemo cannot push the host into launchd SIGBUS / initproc-exited kernel panic'
    - 'Incident reproduction notes preserved: macOS 26.5.2 (25F84), panic string initproc exited namespace 2 subcode 0xa (SIGBUS), mnemo brew service homebrew.mxcl.mnemo, mnemo.db ~24GB, vnodes 263168/263168 while mnemo held ~72k FDs'
    context: |-
      2026-08-01 host kernel panic: initproc exited / SIGBUS after vnode table exhaustion. mnemo brew service held ~72k FDs (~65k REG + ~7k DIR) under ~/.claude/projects and ~/.grok/sessions; stopping mnemo dropped system open files ~88k→~8.8k. mnemo.db ~25GB. Service left stopped as mitigation.

      **Root cause (2026-08-01 investigation, named path):** not a classic unclosed-handle leak. `Store.Watch` (`internal/store/store.go`) recursively `filepath.Walk`s transcript roots and `fsnotify.Add`s every directory. On Darwin, fsnotify uses **kqueue**, which opens an FD for every watched path and, on `Add(dir)`, opens **every file in that directory** (`watchDirectoryFiles`) to emulate inotify child writes. Live corpus math matched the incident: ~4.5k dirs + ~61k files ≈ ~65k FDs. Vault watcher uses the same recursive fsnotify pattern. fsnotify has no FSEvents backend (fsnotify#11).

      **Harness I/O (mixed):** Codex holds rollout jsonl open; Grok holds events.jsonl open but updates.jsonl (ingested) often open/write/close; Claude liveness assumes held-open jsonl. Appends are same-path growth, not per-event creates — tree/root watches + size>offset poll, not per-file kqueue, are the right model.

      **Backend matrix (product decision):** Darwin **FSEvents** on roots; Linux **inotify dirs** (fsnotify); Windows **ReadDirectoryChangesW** (fsnotify); all platforms **bounded safety poll** (incomplete/live/recent) + **hard FD/watch cap** fail-soft. Subscribe to roots; do not reify historical files as individual watches.

      **Decomposition:** T142.1 shared API/filters/cap → T142.2 Darwin / T142.3 Linux / T142.4 Windows / T142.5 poll → T142.6 oracle+docs. Parent achieved when all leaves are.
    depends_on:
    - T142.1
    - T142.2
    - T142.3
    - T142.4
    - T142.5
    - T142.6
    tags:
    - reliability
    - macos
    - incident
    - fd-leak
    - vnodes
    origin: incident:2026-08-01-kernel-panic-initproc
    discovered: 2026-08-01
    achieved: 2026-08-01

  T118:
    name: A failure inside Apple Vision OCR degrades that one image, and can never abort the daemon
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'An OCR call that aborts inside the native framework does not terminate the mnemo process; ingest, compaction, mirrors and the MCP endpoint keep serving. Oracle: fault-injection test (or a fixture image known to trip the Metal path) leaves the process alive and the image marked failed.'
    - 'The failing image is recorded as OCR-failed and is not retried indefinitely on every startup. Oracle: after a simulated abort, a second backfill pass skips that image.'
    - 'OCR can be disabled without a code change, so a machine with a broken Metal/Vision stack can run mnemo unattended. Oracle: config flag (or auto-disable after N consecutive aborts) verified by a restart with the flag set producing no OCR calls.'
    - The abort is visible as a fail-severity health check / log line naming the image id and the framework error, not just a stack dump.
    context: 'Observed 2026-07-26 20:16 while restarting the daemon for 🎯T117 verification. The process died with SIGABRT raised inside cgo during Apple Vision OCR: runAppleVisionOCRNative -> _Cfunc_mnemo_ocr_recognize (internal/store/ocr_darwin.go:36), preceded by "AGX: agxa_compiler.mm:120 *** Could not open /System/Library/PrivateFrameworks/AGXCompilerCore.framework/agxa_compiler_hash" and "metal library file .../MPSNeuralNetwork.framework/Resources/default.metallib failed to open". So the machine''s Metal/MPS shader stack is broken for this path; Vision aborts the process rather than returning an error, and a cgo abort cannot be recovered in-process with recover(). Soft "image OCR failed ... VNImageRequestHandler.performRequests failed" warnings for the same subsystem had been appearing benignly for hours before it escalated to a hard abort. Impact is severe and disproportionate: one undecodable image killed ingest, the compaction watcher, all mirror streams and the MCP endpoint. A restart got past it, so it is not deterministic on the same image, which makes it worse — it is a random daemon killer. Likely shapes: run OCR in a subprocess so an abort is contained, and/or gate it behind a config flag plus an auto-disable after repeated aborts. Note there is currently NO way to turn OCR off without rebuilding.'
    tags:
    - ocr
    - stability
    - cgo
    - darwin
    - crash
    origin: daemon crash observed during T117 verification, 2026-07-26
    discovered: 2026-07-26
    achieved: 2026-07-26
  T119:
    name: 'Image OCR succeeds at a rate explained by image content, not by how long the daemon has been running: no systematic failure cliff partway through a backfill'
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 1.0
    attestation: 'Oracle is the live index, queried via mnemo_query against rows the daemon''s shipping OCR path wrote — not a test fixture and not my own inventory. Full corpus: 772 images, 772 attempted, 771 ok, 1 failed (0.13%), against 48% failing on 2026-07-26. Cliff gone: id-blocks of 64 give 64/64 for every block from 384 up, the exact range that was previously 0 ok / 64 failed. Sole failure (image 73) is a 41-byte file containing a bare SHA1 digest under a .png name — genuinely undecodable, width/height 0. Fix is 🎯T118''s subprocess-per-image isolation; no residual cause remained. Residual risk: a future Vision/Metal regression would reappear as the same order-dependent cliff, and nothing standing re-runs this block-wise check — the evidence here is a one-off measurement, not a wired oracle.'
    acceptance:
    - 'A full OCR backfill over the existing corpus completes with a failure rate consistent with genuinely unrecognisable images (single-digit percent), not the ~48% observed on 2026-07-26. Oracle: clear image_ocr error rows, re-run the backfill, and compare per-block success rates.'
    - 'Success rate does not degrade with position in the run: the last decile of images processed succeeds at a rate comparable to the first. Oracle: the id-block query that exposed the cliff (0-319: 318 ok/1 failed; 384+: 0 ok/254 failed) shows no such discontinuity.'
    - The root cause is named and evidenced rather than assumed — whether it is per-process Metal/AGX resource exhaustion, a leak in the native recogniser, concurrency against the GPU, or something else. A one-line explanation ties the observed cliff to a mechanism.
    - If subprocess isolation (🎯T118) alone resolves it, that is recorded as the explanation and the fix, with before/after numbers; if it does not, the residual cause is diagnosed separately.
    context: |-
      Found 2026-07-26 while fixing 🎯T118. 307 of 637 images (48%) had an OCR error recorded, all apple_vision: 278 "VNImageRequestHandler.performRequests failed", 28 "TextRecognition.CR…", 1 undecodable.

      ROOT CAUSE ESTABLISHED: per-process resource exhaustion in the Vision/Metal stack, not bad images and not a broken machine. Two independent lines of evidence. (1) Failures cluster by processing order, not by content: image ids 0-319 were 318 ok / 1 failed, 320-383 were 12 ok / 52 failed, and every block from 384 up was 0 ok / 64 failed — Vision worked essentially perfectly for the first ~330 recognitions in the process, then failed for every subsequent one. Consistent with the AGX compiler error ("Could not open .../AGXCompilerCore.framework/agxa_compiler_hash") and MPS metallib load failure logged at the moment of the SIGABRT. (2) Three images that failed inside the daemon succeeded when re-run by hand through the same binary. Not format-specific (PNG was 327 ok / 303 failed).

      FIX: 🎯T118's subprocess-per-image isolation resolves it as a side effect — each recognition starts a fresh process and cannot inherit an exhausted one.

      CLOSED 2026-08-05. The backfill has fully drained and the corpus was re-measured against the live index.

      - Aggregate: 772 images, 772 attempted (zero un-attempted), 771 ok, 1 failed = 0.13%. The criterion asked for single-digit percent against the 48% observed on 2026-07-26.
      - No positional cliff: bucketing by image id in blocks of 64 gives 63/63, 63/64, and 64/64 for every one of the remaining eleven blocks. The exact blocks that exposed the cliff — 384 and up, previously 0 ok / 64 failed each — are now 64/64 each. The last decile matches the first.
      - The single remaining failure is genuinely undecodable, as the criterion contemplated: image 73 is a 41-byte file named world.200407.3x21600x10800.png whose entire content is the hex digest efe6522a74782789d23d422daebf46c3393e17a5 — a pointer/placeholder in squz/yourworld, not image data. width and height are 0. No decoder could read it.
      - The residue drained as predicted rather than in one run: the re-OCR lands on 2026-07-26 (214 ok / 1 failed) and 2026-07-27 (139 ok), with ingest since. The 203 images outstanding when this target was last reviewed are all processed.

      So 🎯T118's subprocess isolation is recorded as both the explanation and the fix, with before/after numbers, and no residual cause needed separate diagnosis.


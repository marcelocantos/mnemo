    - safety
    - observability
    origin: manual
    discovered: 2026-07-29
    achieved: 2026-07-29
  T137:
    name: Agent trees are reconstructed and costed as a whole, so a fan-out that collectively blows the budget is attributable to the thing that started it
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - 'An agent tree is reconstructable from ingested transcripts: parent/child edges, depth, and the root turn that spawned it. The columns exist and are populated — agent_id on 870,247 entries, parent_tool_use_id on 623,094, is_sidechain on 857,474 — with indexes on the first two. The traversal is what is missing.'
    - Cost rolls UP the tree, not just per agent. The failure this exists for is a fan-out where every individual agent looks reasonable and forty together trip the wire. A per-agent ranking cannot see that; only an aggregate at the root can.
    - Nested fan-outs are handled — a subagent spawning subagents rolls up through every level, and depth is reported, since a tree three deep is a different problem from a wide shallow one.
    - 'ROOT CAUSE is identifiable: which session, which turn, and where possible which skill or prompt started the tree. ''You spent a lot'' is not actionable; ''this command on this turn spawned 40 agents'' is.'
    - Trees still running are distinguishable from finished ones and resolve to live processes via mnemo_whatsup (🎯T9.5) and LiveSessions (🎯T9.5.1), so an in-progress storm can be stopped rather than mourned.
    - Ranking is by aggregate tree cost, so an expensive tree surfaces above a single expensive agent.
    - SCOPE IS CLAUDE-ONLY, stated rather than discovered. The parentage columns are extracted from Claude Code's record shape; Codex usage blocks are bare {input_tokens, output_tokens} with no message id and no parent linkage, and its ingest currently maps rollout sub-events one-to-one onto assistant entries — 460,329 entries for one session, peaking at 19,647 in a single second (🎯T135). A tree built over that would be noise presented as structure. Other providers are out of scope until their ingest is understood.
    - It refuses to cost a tree whose spend 🎯T135 reports as unpriced or uncountable, rather than showing a plausible zero. A fan-out ranked at zero cost because its provider has no rate card is worse than one ranked as unknown.
    context: |-
      Marcelo, 2026-07-29, while asking that the cost discussion be captured as targets: "also include a mention of the need to deal with out-of-control agent trees. It might not be one single agent that's causing problems, but a large fan out that collectively is tripping the wires, and the system needs to be sophisticated enough to enable root cause analysis."

      This is the sharpest gap in 🎯T135 as first written. That target attributes spend to sessions and directories, which finds a single runaway agent and completely misses the case that actually matters: a fan-out where each agent is individually unremarkable and the aggregate is the problem. Ranking sessions by cost would show forty modest entries and nothing obviously wrong.

      It also interacts with the control side (🎯T136). Throttling mnemo's own agents does nothing about a Claude Code sub-agent storm, which passes through neither mnemo nor claudia — so for trees, reporting and root-cause analysis is the ONLY available response, and it has to be good enough to act on manually. That makes this target load-bearing for the whole cost story rather than a refinement of it.

      WITNESS — the edges are already ingested and indexed.

      entries carries generated columns agent_id ($.agentId), parent_tool_use_id ($.parentToolUseID), top_tool_use_id ($.toolUseID) and is_sidechain ($.isSidechain), with idx_entries_agent_id and idx_entries_parent_tool_use_id over the first two. Population on the live index: 870,247 / 623,094 / 857,474 out of 3,552,162 entries. So the graph is present and indexed; the work is a recursive traversal (SQLite CTE), a cost rollup keyed on the same per-token-class pricing 🎯T135 needs, and a surface that ranks by tree total.

      Live-tree identification composes what exists: LiveSessions (🎯T9.5.1) maps an open transcript handle to a pid, and mnemo_whatsup (🎯T9.5) already joins that with cwd, repo and topic.

      Depends on 🎯T135 for pricing: a tree rollup computed with Codex tokens priced at Anthropic rates would rank the wrong trees.

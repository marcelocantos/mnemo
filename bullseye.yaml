  T144:
    name: One search spans the index and returns what it finds, typed — separate per-corpus search tools stop existing because they are subsumed, not deleted
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 13.0
    attestation: 'All nine criteria met; 35 tests across six files, make bullseye green. (1) mnemo_search spans 8 default corpora returning typed hits, with a kinds filter and 4 more corpora on request. (2) Ranking is per-corpus quantile calibration — TestQuantileIsScaleInvariant pins that corpora with 0..1 and 0..10000 score ranges map equivalent-quality hits to equivalent quantiles, which is exactly what raw BM25 comparison cannot do. (3) Refresh is a reconciler on the 🎯T68 data plane; TestReconcilerRegisteredInDataPlane pins that it is actually wired, since an unwired reconciler decays as silently as an unwired oracle. (4) Staleness is visible and its absence safe: 8 refresh tests cover cold start, quiescence, growth, age, cancellation, an uncalibratable corpus not failing the pass, and staleness clearing so search moves onto the calibrated path; degradation falls to RRF and never to raw comparison. (5) Both ranking oracles present — small-corpus-strong vs large-corpus-weak interleaving, and short-document corpora not monopolising the head, the latter running against the CALIBRATED path rather than the degraded one. (6) Segment enrichment attaches the smallest enclosing span to message hits, is optional, and is tested three ways. (7) mnemo_segments and mnemo_decisions retired by subsumption verified shape by shape: TestSubsumptionCoversRemovedTools seeds all ELEVEN affected corpora and asserts each returns its own kind through unified search. (8) The nine tools removed 2026-08-07 are reachable again through search — same test. (9) Cost stated in the description: one FTS query per corpus, 8 by default. Three mutations confirm the oracles bite (inverted span ordering, staleness never reported, offset hydration ids all fail their intended test). Two implementation bugs were found by tests failing correctly: the sample floor was conflated with the 101-point quantile array, refusing to calibrate a homogeneous corpus that calibrates fine at 30; and the first bias oracle used 60 identical documents, giving a degenerate distribution that asserted against a fixture artefact. RESIDUAL RISK, declared: the message corpus is not regressed by construction (it still calls the same Search()), but no end-to-end MCP invocation against a live daemon was performed — the evidence is unit and integration tests. And expand=segment remains default-off pending 🎯T138''s quality gate, so enrichment ships as an additive field rather than as replaced context.'
    acceptance:
    - mnemo_search queries multiple corpora in one call and returns typed hits (message, segment-enriched message, doc, decision, commit, PR, target, memory, …), each labelled with the corpus it came from. A `kinds` filter scopes it; the default spans a curated set rather than all 22 FTS tables.
    - Cross-corpus ranking uses PER-CORPUS QUANTILE CALIBRATION, not raw BM25 comparison and not top-N rescaling. Each corpus has a sampled score distribution; a live score maps to its quantile within its own corpus ('97th percentile for commits'), and quantiles are what compete. Raw comparison is rejected because BM25's avgdl is per-index; top-N min-max/z-score is rejected because it rescales against the head of the distribution, so a corpus whose best hit is poor still maps to 1.0.
    - Calibration is refreshed periodically as a reconciler under the 🎯T68 convergence data plane — incremental, restartable, and re-running only where a corpus has grown enough to move its distribution. A distribution sampled when a corpus was a tenth of its current size mis-maps every score computed against it.
    - Calibration staleness is VISIBLE and its absence is SAFE. Each corpus's calibration carries an age/sample-size, search reports when it is stale, and a missing or stale calibration degrades to rank fusion (RRF) rather than to raw BM25 comparison — falling back to the one method already rejected is how a careful design becomes the failure it was built to avoid.
    - 'Oracle for the ranking itself: a query matching strongly in a small corpus and weakly in a large one interleaves sensibly rather than letting either monopolise the head, and the test states the expected ordering and why. A second oracle pins that a short-document corpus (commit subjects, targets) does not systematically outrank a long-document one (messages) for equivalent match quality.'
    - 'Segments are ENRICHMENT, not a result kind. A message hit inside a span returns the span''s label and summary attached, and the span''s label/summary contribute to retrieval — a message whose enclosing span is about ''FD exhaustion'' ranks for that query even when the message text never says it. This is `expand: "segment"` promoted from opt-in flag to default behaviour.'
    - 'mnemo_segments and mnemo_decisions are retired BY SUBSUMPTION: every query shape they served is reachable through the unified search, verified shape by shape, before either is removed. Segment introspection shapes that are genuinely dev-facing (session topic-AST, containing_msg_id) either survive as search parameters or are stated as dropped.'
    - 'The nine per-corpus tools removed on 2026-08-07 (docs, memories, skills, configs, targets, audit, commits, prs, synthesis) become reachable again through search. That is the point: their deletion was a surface cut that cost discoverability, and this restores it without restoring the tools.'
    - Cost per call is bounded and stated. N FTS queries per search is not free on the tool that is 55% of all agent calls; the default corpus set is chosen with that in mind and the tool description says what it searches.
    context: |-
      Raised by Marcelo 2026-08-07, closing the loop on the 🎯T143 tool-surface reduction: "The point of segmentation is to provide a richer search signal, not as a separate domain. The one search should include segments and return them when found. In fact, I wonder if other surfaces fall into the same category of being explicit orthogonal search pathways that should be folded into the one search."

      THE MEASUREMENT THAT MAKES THIS CONCRETE. The index has 22 FTS corpora — messages, topic_segments, decisions, docs, memories, skills, claude_configs, targets, plans, audit_entries, git_commits, github_prs, github_issues, ci_runs, notes, todos, patterns, themes, compactions, image_descriptions, image_ocr, snapshot_files. mnemo_search queries exactly ONE of them: messages_fts.

      Every other corpus was reachable only through a tool of its own. That is why the surface reached 70 tools: not carelessness, but an architecture where "search X" meant "a tool for X". The per-corpus tools were the symptom.

      WHAT 🎯T143 GOT RIGHT AND WHAT IT LEFT UNDONE. It removed the symptom — nine per-corpus search tools deleted 2026-08-07 — on the correct observation that each was `SELECT … WHERE x_fts MATCH ? ORDER BY rank LIMIT ?` and reproducible through mnemo_query. But the value those tools carried was never the SQL, it was the NAME: an agent scanning a tool list learns that targets exist. Deleting them cost discoverability and offered SQL in exchange, which is a worse trade for the agent even though it is a better tool surface. This target is the other half: once one search spans the corpora, those nine are subsumed rather than merely gone.

      SEGMENTS ARE THE MOTIVATING CASE. mnemo_search already consumes segment data via expand=segment|segment:coarse, which swaps the ±N context window for the smallest enclosing sealed span — but it is default-off pending 🎯T138's boundary-quality gates (currently meanPk 0.445 against a 0.40 bar). The machinery exists and is switched off, and alongside it sits a separate mnemo_segments tool serving thematic search over span labels. That is the "separate domain" framing being rejected: segmentation exists to make search better, so its output belongs inside search results. Note the ordering dependency: promoting expand to default is gated on 🎯T138, so the enrichment criterion ships behind that gate or ships opt-out, but should not silently wait.

      WHY NOT ONE UNIFIED FTS INDEX — investigated 2026-08-07 and REJECTED on evidence, recorded here so it is not re-proposed as a simplification.

      All 22 indexes are external-content (`content=<table>, content_rowid=id`): they store only the index, never a copy of the text, and read rows back from the source by rowid. That mode binds one index to exactly one table, so 22 sources forces 22 indexes. It is not a design choice; it falls out of not duplicating text — the same duplication 🎯T51 exists to eliminate.

      A contentless unified index (`content=''`) carrying (kind, source_rowid) IS viable, and more cheaply than expected: snippet() and highlight() have ZERO call sites in the codebase, so nothing depends on FTS5 storing column values. But it must not be built, because of avgdl:

      BM25 normalises document length by `b·|D|/avgdl`, and avgdl is PER-INDEX. Today each corpus normalises a document against the average length of its own corpus, which is correct. A unified index would normalise everything against one global avgdl dominated by 2,967,193 messages, so a 10-word commit subject gets |D|/avgdl ≈ 0.03, shrinking the denominator and inflating its score. Unification does not fix length bias — it INTRODUCES one that does not currently exist, and hides it behind a single authoritative-looking number. Corpus sizes here span 2,967,193 messages against 245 targets, a 12,000x spread.

      Also: SQLite's FTS5 hardcodes k1=1.2 and b=0.75. The only ranking knob is per-column weights via bm25(fts, w1, w2, …), and all 16 ranking sites today use bare `ORDER BY rank` — every column weighted 1.0. So there is unused headroom in column weighting, but no b to tune.

      THE RANKING APPROACH, chosen by Marcelo 2026-08-07: per-corpus quantile calibration with periodic refresh.

      Each corpus gets a sampled score distribution; a live BM25 score maps to its quantile within its own corpus, and quantiles compete across corpora. This asks "how good is this hit relative to typical hits in its own corpus", which is the question cross-corpus interleaving actually needs.

      Two alternatives were considered and rejected. Raw BM25 comparison fails for the avgdl reason above. Top-N min-max or z-score rescaling fails worse and more subtly: it normalises against the head of each returned window rather than the corpus, so a corpus whose best hit is poor still maps to 1.0 — it destroys exactly the "how good is the best match" signal that fusion depends on.

      RRF (Σ 1/(k + rank)) remains in the design as the DEGRADED path, not the primary one: it needs no calibration and is robust, but is quality-blind — a corpus's #1 contributes as #1 however poor it is. That property makes it the right fallback when calibration is missing or stale, and the wrong default. Falling back to raw BM25 comparison instead would land on the one method already rejected, which is why the acceptance names the fallback explicitly.

      The refresh is a reconciler under the 🎯T68 convergence data plane, consistent with how patterns (🎯T64.7) and clustering (🎯T64.8) already refresh: incremental, restartable, re-running only where a corpus has grown enough to move its distribution. Staleness must be visible rather than silent — a distribution sampled when a corpus was a tenth of its current size mis-maps every score computed against it, and nothing about the resulting ordering would look wrong.

      WHAT THIS DOES NOT COVER. Aggregation and navigation tools (mnemo_recent_activity, mnemo_repos, mnemo_sessions, mnemo_status, mnemo_stats) are not search pathways and are out of scope. mnemo_query stays — raw SQL is the escape hatch, and 🎯T66 (generated schema docs) remains the right fix for its documentation drift.

      Achieved 2026-08-07: All nine criteria met; 35 tests across six files, make bullseye green. (1) mnemo_search spans 8 default corpora returning typed hits, with a kinds filter and 4 more corpora on request. (2) Ranking is per-corpus quantile calibration — TestQuantileIsScaleInvariant pins that corpora with 0..1 and 0..10000 score ranges map equivalent-quality hits to equivalent quantiles, which is exactly what raw BM25 comparison cannot do. (3) Refresh is a reconciler on the 🎯T68 data plane; TestReconcilerRegisteredInDataPlane pins that it is actually wired, since an unwired reconciler decays as silently as an unwired oracle. (4) Staleness is visible and its absence safe: 8 refresh tests cover cold start, quiescence, growth, age, cancellation, an uncalibratable corpus not failing the pass, and staleness clearing so search moves onto the calibrated path; degradation falls to RRF and never to raw comparison. (5) Both ranking oracles present — small-corpus-strong vs large-corpus-weak interleaving, and short-document corpora not monopolising the head, the latter running against the CALIBRATED path rather than the degraded one. (6) Segment enrichment attaches the smallest enclosing span to message hits, is optional, and is tested three ways. (7) mnemo_segments and mnemo_decisions retired by subsumption verified shape by shape: TestSubsumptionCoversRemovedTools seeds all ELEVEN affected corpora and asserts each returns its own kind through unified search. (8) The nine tools removed 2026-08-07 are reachable again through search — same test. (9) Cost stated in the description: one FTS query per corpus, 8 by default. Three mutations confirm the oracles bite (inverted span ordering, staleness never reported, offset hydration ids all fail their intended test). Two implementation bugs were found by tests failing correctly: the sample floor was conflated with the 101-point quantile array, refusing to calibrate a homogeneous corpus that calibrates fine at 30; and the first bias oracle used 60 identical documents, giving a degenerate distribution that asserted against a fixture artefact. RESIDUAL RISK, declared: the message corpus is not regressed by construction (it still calls the same Search()), but no end-to-end MCP invocation against a live daemon was performed — the evidence is unit and integration tests. And expand=segment remains default-off pending 🎯T138's quality gate, so enrichment ships as an additive field rather than as replaced context.
    origin: manual
    discovered: 2026-08-07
    achieved: 2026-08-07
  T145:
    name: One slow or hung stream reconciler cannot starve the others, and a clustering run that never finishes is detected rather than restarted forever
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A reconciler that blocks for longer than its own interval does not prevent other registered streams from running. Oracle: a test registers a deliberately-blocking stream ahead of a fast one and asserts the fast one still reconciles.'
    - Each stream gets a bounded per-pass deadline, after which it is abandoned for that tick rather than holding the worker. The bound is stated per stream, since a 24h clustering pass and a 1-minute mirror sweep do not want the same one.
    - clusterReconcilerStream stops starting a new run while a prior run is unfinished. Today its guard skips only when `last.EndedAt != ""`, so a run that never completes leaves ended_at NULL and a fresh run starts on EVERY tick — observed as 4 cluster_runs rows with ended_at NULL, the oldest predating the current daemon.
    - A run interrupted by daemon shutdown is distinguishable from one still in flight. Rows whose process died mid-run are marked (failure_mode or equivalent) at next startup rather than remaining indefinitely ambiguous, which is what makes the guard above implementable at all.
    - A stream that has not completed a pass within a stated multiple of its interval is visible in mnemo_doctor / GET /health. The 🎯T144 calibration reconciler ran zero times in ten minutes of live operation and nothing anywhere reported it — not the health check, not the logs at INFO, not the tool output beyond a per-corpus 'no calibration' note that reads as cold-start rather than starvation.
    - Ordering in StreamReconcilers() stops being load-bearing. 🎯T144 currently sits ahead of clustering with a comment explaining that its position is what makes it run at all; that comment should become removable.
    context: |-
      Found 2026-08-07 while running the 🎯T144 build in place of the installed daemon — i.e. by the one check the unit tests could not perform.

      WHAT HAPPENED. 🎯T144's calibration reconciler was registered last in Store.StreamReconcilers(). The registry worker (internal/registry/registry.go:673) drives reconcilers SEQUENTIALLY within one tick, so everything after a long-running stream waits for it. Clustering sits fourth and, on this machine, does not finish: cluster_runs holds four rows with ended_at NULL, the oldest from a daemon two restarts ago. Result: calibration executed ZERO times in ten minutes of live running, search stayed on the degraded fusion path indefinitely, and all 35 🎯T144 tests passed throughout — because they call Reconcile directly and never through the shared worker.

      That gap is the interesting part. The tests verified the reconciler works; production required that the reconciler RUNS. An unwired oracle decays; so does a wired one that never gets a turn.

      TWO DEFECTS, ONE PRE-EXISTING.

      1. STARVATION (the worker). One slow stream blocks every stream after it. There is no per-stream deadline and no concurrency, so registration order silently determines whether a stream executes at all. 🎯T144 worked around this by moving calibration ahead of clustering, with a comment saying so — a workaround that will rot the moment someone reorders the list for an unrelated reason.

      2. CLUSTERING NEVER COMPLETES (🎯T64.8, pre-existing). Its interval guard skips only when `last.EndedAt != ""`. A run that never sets ended_at therefore fails the guard every tick and starts another run, forever. Whether the underlying pass is genuinely hanging or is merely being killed by each daemon restart before it can finish is NOT yet established, and the two have different fixes: a hang needs a bound, a restart-kill needs interrupted runs marked at startup. Establish which before fixing.

      WHY THIS IS SEPARATE FROM 🎯T144. The calibration reconciler is correct and tested; what failed is the plane it runs on, which predates it and affects patterns and source_state equally. Fixing scheduling inside a search target would bury an infrastructure bug inside a feature.

      The visible symptom to preserve for whoever picks this up: nothing reported the starvation. Not the health check, not the logs, not the tool output — mnemo_search said "no calibration" per corpus, which reads exactly like a cold start and would have gone unnoticed indefinitely on a machine nobody was watching.
    origin: manual
    discovered: 2026-08-07
  T15:
    name: Federated queries across linked mnemo instances expose session history from every host as one searchable surface
    status: achieved
    value: 8.0
    cost: 5.0
    acceptance:
    - All sub-targets T15.1, T15.2, T15.3, T15.4, T15.5 are achieved.
    - Two mnemo daemons (separate hosts, or two local temp-dir instances for CI) are configured as each other's peers via `linked_instances` and each daemon's `~/.mnemo/peers/` holds the other's public cert.
    - A single mnemo_search from one daemon returns attributed hits from both daemons in one response, with the correct `instance` field on each record.
    - 'Per-peer timeout + graceful degradation verified end-to-end: stopping one daemon mid-query lets the surviving daemon''s response complete with local hits and a structured warning naming the stalled peer.'
    - Write-shaped tools (ingest, describers, mnemo_self, template writes, etc.) never cross a federation boundary — verified by absence from the federated tool set and by a test attempting such calls over mTLS.
    context: |-
      **Reframed 2026-04-15.** The original T15 framing was "macOS mnemo daemon reaches into a Windows VM's Claude projects dir over an SMB mount, with a Windows stub relaying fsnotify-equivalent events via pigeon." That approach coupled mnemo to fragile filesystem-over-network semantics, required a new relay (pigeon), and did not generalise past one VM.

      The cleaner model is **query federation**: each host runs its own mnemo, indexes its own ~/.claude/projects/ locally, and linked instances fan out queries to each other at read time. This:
      - removes all cross-host file access (no SMB, no fsnotify-over-SMB, no pigeon relay),
      - makes T22 (mnemo native on Windows) a direct prerequisite rather than a parallel workstream,
      - scales to any number of linked hosts (not just one VM),
      - degrades gracefully when peers are offline (timeout + warn, local results still returned),
      - keeps each host's write surface local and authoritative.

      **Partial work already shipped (2026-04-15, keep as orthogonal utility):** `config.extra_project_dirs` + startup ingest from extra Claude project dirs is already wired (commits 8700c48, 67fdd9d). This remains useful for legitimate local-ish extra dirs (e.g. a team-shared workspace that's actually locally mounted), but it is NOT the federation mechanism \u2014 it should not be used to reach into a VM's projects dir over SMB.

      **Why this depends on T22:** federation in practice requires a second mnemo instance running natively on the remote host. On Windows that means T22 (mnemo daemon native on Windows, now achieved).

      ---

      **Architecture correction 2026-04-19.** Two premises in the earlier context were wrong:

      1. mnemo's transport is HTTP MCP (streamable-HTTP via mark3labs/mcp-go on :19419), NOT a UDS/internal RPC surface. The stale `~/.mnemo/mnemo.sock` file is a pre-v0.20.0 artefact; no current Go code references it. Federation extends the existing HTTP MCP transport with a second mTLS-wrapped HTTP endpoint \u2014 not a non-existent `internal/rpc` package.

      2. T22 shipped Windows native build support only. It did NOT produce any mTLS infrastructure (no `tls.Config`, `x509`, or `LoadX509KeyPair` anywhere in the repo). The claim that federation "reuses T22's mTLS endpoint file" was aspirational; T15.1 builds that mechanism from scratch.

      **Decomposition (2026-04-19).** T15 is now an umbrella target over five leaves:
      - **T15.1** mTLS endpoint-file machinery (cert gen + peer-cert trust store)
      - **T15.2** `linked_instances` config surface
      - **T15.3** federated read-only MCP endpoint (server-side, mTLS)
      - **T15.4** federated MCP client (caller-side, mTLS, timeout, typed errors)
      - **T15.5** fan-out + merge + attribution + graceful degradation in query tools

      Each leaf has its own observable checkpoint. This parent's acceptance is the end-to-end integration demo: two peered daemons, a single cross-instance search, attributed results, graceful degradation on peer failure, write-tool isolation.

      **Tags:** cross-platform, federation, query
    depends_on:
    - T22
    - T15.1
    - T15.2
    - T15.3
    - T15.4
    - T15.5
    tags:
    - ingest
    - cross-platform
    - pigeon

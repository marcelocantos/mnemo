  T124:
    name: Mirror stream work is cancellable and silent about directories that are not git repos, so shutdown does not have to abandon it
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    attestation: 'All four criteria met with automated oracles, `make bullseye` green (fmt/vet/build/tests). Cancellation: TestPollGitHubCancelledMidFetch, TestPollCICancelledMidFetch, TestIngestGitCommitsCancelled, TestReconcileStaleMirrorsStopsOnCancel — each cancels a 60s-sleeping stub after 50ms and requires return inside 3s with a cancellation error; mutation-tested by reverting one CommandContext, which makes the first hang 60s and fail. Close promptness: TestClosePromptWhenWorkersCooperate, deleted in 🎯T123, reinstated and passing in ~0.12s against the 3s grace over five runs — the mirror subprocesses were the sole blocker. Quiet non-repos: TestIngestGitCommitsEmptyRepoIsQuiet, TestIngestGitCommitsNonRepoIsClassified, TestCommitsStreamStopsReShellingNonRepo (counts stub-git spawns, since the defect was repeated work rather than a wrong answer). Residual risk, declared: criterion 3''s stated oracle was an hour of daemon runtime and that soak was not run — instead the `slog.Warn("git log failed")` statement is deleted outright, so no runtime can emit it, but an unrelated warning path would not have been caught. Also note the target''s premise was wrong: the three named directories are real checkouts with zero commits, not non-repos, so the fix distinguishes three states rather than two.'
    acceptance:
    - 'The gh and git subprocesses spawned by the mirror streams take a context (exec.CommandContext), so cancelling the worker context terminates them rather than letting them run to completion. Oracle: a test cancels mid-fetch and asserts the call returns promptly with a cancellation error.'
    - 'Registry.Close returns well inside workerDrainGrace when the only work in flight is mirror work — i.e. the bounded wait added by 🎯T122 becomes a genuine backstop rather than something the healthy path relies on. Oracle: the test deleted during 🎯T123 (Close is prompt when workers stop) can be reinstated and passes.'
    - 'A session-connected directory that is not a git repo produces no recurring warning from the commits stream. Oracle: over an hour of runtime, ''git log failed ... exit status 128'' appears at most once per repo, or not at all.'
    - The commits stream, like the gh streams, skips a path it has established is not a git checkout rather than re-shelling every pass.
    context: |-
      Filed 2026-07-28 during a pre-PR pass over the graph. Two related loose ends this session surfaced but did not fix.

      (1) The mirror streams shell out via exec.Command with NO context: fetchAndUpsertPRs / fetchAndUpsertIssues (gh pr list, gh issue list), pollCIForRepo (gh run list), and ingestGitCommits (git log). Cancellation therefore does not reach them, so a subprocess in flight runs to completion no matter what shutdown wants. That is why 🎯T122 had to bound Registry.Close's worker wait and abandon workers rather than await them — and why a test asserting Close is prompt for well-behaved workers had to be deleted in 🎯T123 (it failed: the daemon's own workers take >3s to notice cancellation). Making these context-aware removes the need to abandon anything and turns the grace back into a true backstop.

      (2) The commits stream re-runs `git log` every pass against session-connected directories that were never git repos, producing recurring "git log failed ... exit status 128" warnings — observed for Health-Management-Systems/fundguard, marcelocantos/quixy and marcelocantos/vendep, three per reconcile pass, indefinitely. 🎯T116/🎯T117 gave the gh streams identity resolution and failure backoff; the local commits stream got the session-scoping but not the equivalent "this is not a checkout, stop asking" handling.

      RESOLVED 2026-08-05.

      DIAGNOSIS CORRECTION worth keeping: part (2)'s premise was wrong, and a fix written to the target as filed would not have worked. The three named directories are NOT non-repos. All three pass `git rev-parse --git-dir`, so the guard that already existed at the top of ingestGitCommits let them straight through. They are real checkouts that have never been committed to, and `git log` exits 128 on them with "your current branch 'master' does not have any commits yet" — never-pushed `git init` scaffolds, the same population 🎯T116 mentions. Classifying by "is it a checkout" could never have silenced them.

      So the fix separates three states rather than two: not a checkout (errNotGitCheckout, memoised so git is never spawned there again), a checkout with no commits (quiet success — nothing to index, nothing wrong), and a genuine failure (propagated to 🎯T91's backoff). The `slog.Warn("git log failed")` statement is deleted outright rather than made conditional.

      WHAT SHIPPED:

      - All five gh/git subprocess sites in store.go take a context: gh run list, gh run view --log, gh pr list, gh issue list, git rev-parse, git log. `grep 'exec.Command('` over store.go now returns nothing. The context was already reaching the mirror stream and being discarded — mirrorReconcilerStream.Reconcile took `_ context.Context` — so this was a plumb-through, not new machinery.
      - ReconcileStaleMirrors takes a context and checks it between streams and between repos, so cancellation unwinds the pass rather than only the one subprocess.
      - Cancellation is NOT recorded as a mirror failure. Counting it would let a few restarts back a healthy repo off for hours, attributed to a fault that never happened — the exact failure mode 🎯T91 exists to create deliberately and this would have created by accident.
      - ingestGitCommits returns (int, error) instead of a bare count. Returning only a count is why the empty-repo case could never reach the backoff machinery: the closure always returned nil, so every pass recorded a success and fail_count stayed at 0 forever.

      ORACLES (all pass; internal/store/mirrors_cancel_test.go, mirrors_commits_test.go, internal/registry/drain_test.go):

      - Cancellation, per stream: a fake gh/git that sleeps 60s is cancelled after 50ms; each of pollGitHubForRepo, pollCIForRepo, ingestGitCommits and ReconcileStaleMirrors must return inside 3s with a cancellation error. Mutation-tested: reverting a single CommandContext back to Command makes TestPollGitHubCancelledMidFetch hang the full 60s and fail, so the test is measuring the fix rather than passing by construction.
      - Close promptness: TestClosePromptWhenWorkersCooperate, the test deleted in 🎯T123, is reinstated and passes in ~0.12s against the 3s grace, stable over five runs. The mirror subprocesses were the sole blocker, which confirms 🎯T123's diagnosis. 🎯T122's bounded wait is now a genuine backstop.
      - Empty repo is quiet: a real `git init` with no commits returns (0, nil).
      - Non-checkout is classified and then skipped WITHOUT re-shelling: a stub git counts its own invocations, and the count must not rise after the path is memoised. Counting spawns is the only honest test here — the defect was repeated work, not a wrong answer, so an assertion on the return value alone would pass against the old code too.

      RESIDUE, declared rather than papered over: criterion 3's stated oracle was an hour of daemon runtime showing at most one warning per repo. That observation was not run. What was done instead is stronger in one respect and weaker in another — the log statement no longer exists in the binary, so no runtime can emit it, but the hour-long soak that would have caught an unrelated warning path was not performed. An empty repo is still re-probed every 30 minutes (two cheap spawns, silent), deliberately: a scaffold can gain commits later, and memoising that would make a temporary state permanent.

      Achieved 2026-08-05: All four criteria met with automated oracles, `make bullseye` green (fmt/vet/build/tests). Cancellation: TestPollGitHubCancelledMidFetch, TestPollCICancelledMidFetch, TestIngestGitCommitsCancelled, TestReconcileStaleMirrorsStopsOnCancel — each cancels a 60s-sleeping stub after 50ms and requires return inside 3s with a cancellation error; mutation-tested by reverting one CommandContext, which makes the first hang 60s and fail. Close promptness: TestClosePromptWhenWorkersCooperate, deleted in 🎯T123, reinstated and passing in ~0.12s against the 3s grace over five runs — the mirror subprocesses were the sole blocker. Quiet non-repos: TestIngestGitCommitsEmptyRepoIsQuiet, TestIngestGitCommitsNonRepoIsClassified, TestCommitsStreamStopsReShellingNonRepo (counts stub-git spawns, since the defect was repeated work rather than a wrong answer). Residual risk, declared: criterion 3's stated oracle was an hour of daemon runtime and that soak was not run — instead the `slog.Warn("git log failed")` statement is deleted outright, so no runtime can emit it, but an unrelated warning path would not have been caught. Also note the target's premise was wrong: the three named directories are real checkouts with zero commits, not non-repos, so the fix distinguishes three states rather than two.
    tags:
    - mirrors
    - shutdown
    - noise
    - cancellation
    origin: pre-PR graph pass, 2026-07-28
    discovered: 2026-07-28
    achieved: 2026-08-05

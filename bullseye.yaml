    name: 'The tool surface cannot quietly regrow: adding one is a deliberate act with a named consumer, checked automatically'
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    attestation: 'Two halves, both shipped. ENFORCING: TestToolSurfaceRatchet compares the registered set against the committed ledger in internal/tools/surface.go in BOTH directions, and TestToolSurfaceSize pins the count at 38; both run in `make bullseye`, which is green. Every tool declares a consumerKind (agent/skill/app/user), so "has a consumer" is machine-checked rather than asserted in prose. The ratchet earned its keep during this very change: it caught mnemo_ops being defined but never registered, after an insertion offset went stale mid-edit and landed the call inside a description string literal — the build was green and the tool was simply absent, which is exactly the silent drift it exists to catch. REPEATABLE AUDIT: internal/tools/surface_audit_test.go, build-tagged `audit`, counts agent calls (live index), skill references (grep over ~/.claude/skills) and HTTP twins (parsed from the route table) SEPARATELY — the distinction that keeps a tool with an app consumer from looking dead. Verified by running it: 38 rows, 5 cold on all three measures, all of them the newly-consolidated or newly-shipped tools the ledger already marks consumerUser. It reports rather than fails, deliberately, because a cold tool is a question for a human. Residual risk: the audit reads a hardcoded ~/.mnemo/mnemo.db and skips when absent, so it is a developer-machine oracle, not a CI one.'
    acceptance:
    - A check fails when the registered tool count exceeds a committed baseline. A ratchet in both directions, not a threshold — the number moves only by editing the baseline in the same commit that adds or removes a tool, so growth is visible in review rather than discovered a year later by an audit.
    - The check runs at a standing enforcement point (make bullseye and/or CI), not as a script someone remembers. An unwired oracle decays, and this one is guarding against a slow drift that no single commit ever looks unreasonable against.
    - Every registered tool declares its consumer in a form the check can read — agent-facing, skill-invoked, HTTP twin, CLI, or app — so 'has a consumer' is verified rather than asserted in prose that goes stale.
    - The usage query that produced the 2026-08-07 audit is committed and repeatable, so 'which tools are cold' is one command rather than an afternoon. It must count agent calls, skill references, and non-MCP callers separately — collapsing them is what makes a tool with an HTTP twin look dead.
    - The baseline is committed with the post-consolidation count and the audit numbers that justify it, so a future reader can tell what the surface looked like when the ratchet was set.
    context: |-
      The loop that makes 🎯T143 hold rather than being a one-off tidy.

      The surface reached 70 tools without anyone deciding it should. Every individual addition was defensible — a subsystem shipped, it got a tool — and the aggregate was never reviewed until an audit went looking. That is the failure mode to close: not carelessness, but the absence of any point at which the total is visible. 🎯T143.3's context records the same pattern inside the vault group, where seven of ten tools appeared in a single month as sub-targets landed.

      Without this node the other five are a snapshot. The vault group alone has two open sub-targets (🎯T64.9, 🎯T64.12) that would each naturally add a tool, and 🎯T140 plans three new HTTP endpoints plus a CLI twin. Regrowth is not hypothetical; it is already scheduled.

      RATCHET, NOT THRESHOLD, deliberately. A threshold ('fail above 45') gets raised the first time it is inconvenient, usually by the person it is inconvenient for, in the commit that makes it inconvenient. A committed baseline that must be edited in the same diff as the tool makes the growth the subject of the review rather than a side effect of it. Both directions matter: a silent DROP is also worth seeing, since it means a capability left without anyone noting it.

      The consumer-declaration criterion is the one with teeth and the one most likely to be watered down to a comment. The audit's central finding was that 'never called by an agent' and 'dead' are different claims — thread tools have an app, vault tools have user workflows — and any check that cannot tell those apart will either flag healthy tools or miss dead ones. If declaring a consumer turns out to be too heavy, the honest fallback is a periodic report rather than a check that lies.

      Depends on the other five so the baseline is set against the intended surface rather than today's.


  T64.12:
    name: 'Cross-repo: work that spans repositories is surfaced as such, without requiring a clustering engine to exist'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Cross-repo views are produced with the clustering engine switched off entirely. Oracle: with themes empty (the current state), a cross-repo surface still identifies genuine multi-repo work. If it returns nothing, the construct is still coupled to themes.'
    - 'At least one non-theme signal drives it — candidates, none mandated: a session whose cwd or activity spans repos, an entity referenced from several repos (target, decision, file, commit, PR), or a search whose top results span repos. The chosen signal is stated and its false-positive behaviour is characterised.'
    - A theme that happens to span repos is ONE input among several, never the definition. If 🎯T64.8 ships, multi-repo themes enrich this surface; if it never ships, the surface still works.
    - Casual co-mention does not become a cross-repo view. Some threshold or weighting keeps the output to work genuinely spanning repos — the vault-clustering design's weight >= 4.0 exists for this reason and the same concern applies to whatever replaces it.
    - The surface is reachable from the tools agents actually use, not only as a vault page.
    context: |-
      Split out of 🎯T64.8 on 2026-07-28. Themes and cross-repo were bundled as one target because docs/design/vault-clustering.md defines cross-repo pages as a derived view over themes: "A theme with len(JSON(repos)) >= 2 AND weight >= 4.0 triggers emission of a cross-repo page at _mnemo/cross-repo/<slug>.md… No separate cross_repos table — cross-repo pages are a derived view over themes."

      They are orthogonal constructs that interact. A theme can be entirely single-repo; work can obviously span repos with no clustering involved. Deriving one from the other was an implementation convenience that hardened into a dependency, and it left cross-repo unreachable while the engine is unbuilt — which matters now that 🎯T64.11 has retired clustering from the segment path and left themes/theme_members dormant on the principle that thematic retrieval is a search problem.


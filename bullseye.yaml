    - schema
    - staleness
    origin: manual
    discovered: 2026-07-28
  T135:
    name: 'Spend is reported against a resetting budget period from transcript evidence, richly enough to act on: which sessions and directories are burning it, and how to stop them'
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 13.0
    acceptance:
    - 'Token counts are DEDUPLICATED. mnemo''s own defect and the largest single error: naive summing over-counts by 1.95x to 2.83x depending on class, and the factor varies BY CLASS so no scalar correction works. More message ids appear twice in the corpus than once (192,442 vs 168,167 groups), usage repeated verbatim — one group carried identical input=5/output=1/cacheRead=18,529 six times. Dedup on (message id, request id), with the key CONFIGURABLE because its validity is environment-dependent: on a Bedrock+Portkey path duplicate message-id groups produced substantial divergence from the platform''s own billing, and a gateway may retry, coalesce or reissue identifiers in either direction.'
    - 'CODEX IS NOT COUNTABLE YET, and must be reported as such rather than estimated. Two independent problems, both verified. Its usage blocks are bare — {input_tokens, output_tokens} with no message id and no cache accounting — so the dedup key does not exist for the source that dominates the wrong totals. And ingest maps rollout sub-events one-to-one onto assistant entries: session 019ee369 (marcelocantos/rustuml, a genuinely long-running piece of work) shows 460,329 assistant entries across 13 active days from ONE file, peaking at 19,647 entries in a SINGLE SECOND. No conversation produces 20k turns per second. Until that mapping is understood, Codex tokens are not a quantity and pricing them is meaningless.'
    - 'Cache writes are priced by TTL TIER, not flattened. 73% of cache-write volume is the long-TTL tier, which prices higher. Verified arithmetically: an opus day fits no single cache-write rate (base gives $6.527 against a reported $7.9230) and closes exactly at the long-TTL rate.'
    - Long-context rates are applied above the per-model threshold, making cache writes a 2x2 matrix over (TTL, context size) and giving input/output/cache-read their own above-threshold rates. Not exceptional here — single requests routinely exceed 800k cache-read tokens.
    - The rate card is FETCHED, not embedded, and is the only genuinely hard part — everything else is arithmetic over data mnemo already holds. A public community-maintained rate file (1.6 MB, 2,984 models) carries every required field including the TTL and long-context variants, in one HTTP request. Gated behind explicit opt-in like cost_reconciliation and image_embeddings, cached locally WITH ITS FETCH DATE.
    - An unpriced model reports as UNPRICED, never as zero. The reference tool gets this wrong — 52,879 tokens of an unknown model reported at $0.00 — and the failure bites hardest exactly when it matters most, since a newly released model is the one missing from the card and the one whose spend you want to see. tokens > 0 AND cost == 0 is a condition to surface.
    - 'No cross-provider pricing. Today mnemo multiplies Codex token counts by Anthropic rates: 99.99997% of one day''s 27.2 billion input tokens were Codex, which reports full prompt per turn with no cache accounting.'
    - Pricing is CONTEMPORANEOUS and settled periods are frozen. Recompute only what can still change; a blanket recompute reprices history every run — a prochronism rather than staleness — and a genuine price revision then propagates backwards with nothing recording it.
    - 'A budget period resets on schedule (monthly on the 1st first), and alerts fire on the PROJECTION rather than a threshold already crossed: ''at this burn rate the month exceeds its cap on the 19th'' permits action where ''80% consumed'' arrives after the decision that caused it.'
    - Alerts name the CULPRITS and offer a way to act — which sessions and directories, resolved to a live pid via mnemo_whatsup (🎯T9.5) and LiveSessions (🎯T9.5.1), with the option to open the offending session's terminal (mnemo_session_go, 🎯T125). Most spend cannot be throttled automatically, so acting on it is the user's job and the report is their only instrument.
    - 'Correctness is proven against an independent implementation as a REGRESSION TEST, not a one-off. ccusage is that oracle: same local transcripts (so divergence is arithmetic, not scope), same session UUID key, ~2s for the whole corpus. Development and CI dependency ONLY — never shipped, never invoked by the daemon, because every query is O(entire corpus) where mnemo''s ingest is O(new bytes).'
    context: |-
      Marcelo, 2026-07-28/29, across several corrections that reshaped this target more than once.

      The idea: "mnemo could also offer a general cost tracking tool with alerting". The environment: "at work, where we pay per token. There are no subsidized plans" — so money is the constraint and reconciliation against an invoice is mandatory. The scope: report and warn, no enforcement (that is 🎯T136). The architecture: enforcement cannot live in claudia because most spend passes through nothing controllable — "sub-agent storms Claude kicks off... It is what it is" — so observation is universal via transcript ingest, control is partial, and the user closes the gap.

      Then the decisive constraint: "I really don't want to add a dependency on a Node.js package."

      That turned out to dissolve rather than constrain. ccusage — the reference implementation used to validate all of this — ships as a compiled per-platform binary behind an npm launcher, which would have been a real erosion of mnemo's single-Go-binary property. But ITS VALUE WAS NEVER ITS CODE. Everything it does beyond pricing is a GROUP BY over data mnemo already ingests. The one thing mnemo lacked was a rate card, and that card is upstream of ccusage: a public community-maintained JSON file, 1.6 MB, 2,984 models, one HTTP GET, carrying every field this specification needs. So mnemo fetches the card, does its own arithmetic in Go, and keeps ccusage as a validation oracle run by a developer or CI — never shipped, never invoked by the daemon.

      That also fixes a shape problem. ccusage is O(entire corpus) per invocation — measured at ~2.2s warm over 9.9 GB, with a 1.37s raw-read floor, no result cache, and `session --id` filtering the OUTPUT rather than the WORK. mnemo's ingest is O(new bytes). A daemon shelling out for live numbers would re-read the whole corpus every tick, competing with its own ingest for I/O.

      Full specification, including the verified arithmetic and the failure modes each requirement exists to prevent, is in docs/design/token-cost-specification.md.

      WITNESS — the parts exist.

      1. mnemo already ingests every transcript from every provider, incrementally by byte offset, and records session, repo, cwd and model per entry. The dedup key fields are present in the raw JSON.
      2. mnemo_usage already aggregates per session, model and window (🎯T43, 🎯T44). The gaps are dedup, TTL and long-context tiers, per-provider rate cards, and an unpriced state — arithmetic and a pricing table, not new plumbing.
      3. The health pipeline (🎯T83) already runs scheduled checks with severity, opt-out notifications and a dashboard deep-link; 🎯T84's breaker shape stops a standing overage re-alerting every few minutes.
      4. mnemo_whatsup (🎯T9.5) and mnemo_session_go (🎯T125) already supply the culprit-identification and take-me-there affordances.
      5. ccusage validates it: same corpus, same session UUIDs, ~2s per full run.

      Order of work: settle the Codex turn-count anomaly, fix deduplication, then TTL/long-context/per-provider pricing with an unpriced state, then the period/projection/alert layer, then the kill and open-shell affordances.

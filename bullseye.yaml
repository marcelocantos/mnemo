    acceptance:
    - 'Supersession is detectable ACROSS sessions, not only within one. 🎯T132 only ever writes the edge inside a single session: the streaming watcher supersedes spans it can still see in its own working set, and finalisation supersedes the stream spans it redrew in that session''s own window. Nothing looks at a span drawn in one session against work done in another.'
    - 'The motivating case resolves: the 🎯T39 FD_ACCEPT example. Segment search serves a confident pre-fix conclusion (''fd I/O not functional on Windows'') from an old session, while the session that overturned it is a different session entirely. After this, the old span is flagged superseded and the corrective span is reachable from it.'
    - Detection is bounded rather than all-pairs. 31k sessions of spans cannot be compared pairwise; candidate pairs come from a cheap signal (FTS/label overlap, shared repo, temporal order) and only candidates are judged.
    - A supersession is only written with a stated reason, and the judgement is recorded so it can be reviewed. An automatic 'this overturns that' with no rationale is a claim no one can check and would quietly corrupt ranking.
    - 'Nothing is deleted, consistent with 🎯T132.1: the superseded span keeps its row and its content, and retrieval demotes rather than hides it.'
    context: |-
      Raised by Marcelo 2026-07-28 while reviewing 🎯T132: does it cover backfilling spans "no longer considered correct"? It does not. 🎯T132's supersession is intra-session by construction — the watcher can only overturn spans in its own bounded working set, and finalisation only supersedes stream spans inside the window it just redrew. A conclusion reached in session A and overturned in session B stays live and confident forever.

      This is the exact case that motivated 🎯T131, whose context records segment search serving pre-🎯T39 conclusions ("fd I/O not functional on Windows"). 🎯T131 fixed ELIGIBILITY — those sessions can now get spans — but nothing marks the older wrong one superseded, so the result is two contradictory spans rather than one correct one.

      Distinct from 🎯T134, which is stale DERIVATION (a better method now exists) rather than stale CONCLUSION (later work proved the claim wrong).

      WITNESS — one viable approach, recorded so this is a build target rather than research. The implementer is free to better it.

      The naive shape is "ask a model whether any span overturns any other": 383 llm spans today is ~73k pairs, and it grows quadratically. Not viable. Three steps make it linear-ish:

      1. CANDIDATE GENERATION, using infrastructure that already exists. topic_segments_fts is an external-content FTS5 table over (label, summary). For each span S, query it for spans sharing terms with S, restricted to the same repo and to last_ts LATER than S's. Take the top K (K≈5) by FTS rank. That is one FTS query per span, not a pairwise scan, and turns O(n^2) into O(n·K).

      2. JUDGEMENT, one call per SPAN rather than per pair. Send S plus all K candidates in a single Task-mode prompt: "Here is a conclusion and five later ones from the same repo. Which, if any, overturn it? Reply JSONL with a reason, or nothing." 383 calls, not 1900. At the ~45k-input fixed overhead measured in 🎯T132.2 that is a bounded, knowable cost before starting — and it shrinks further by only judging spans in repos with activity after the span's own timestamp.

      3. WRITE the superseded_by edge with the model's stated reason, into a column that already exists (🎯T132.1). Nothing is deleted; retrieval demotes.

      Runs as a reconciler under the existing 🎯T68 convergence data plane, so it is incremental, restartable, and re-runs only where divergence appears.

      Cheaper first slice if the full pass is not yet warranted: run candidate generation only for spans actually returned by a search, and queue the judgement asynchronously. That bounds work to what someone actually looked at, at the cost of the first viewer seeing the stale span once.

# hygiene.yaml — declared, drift-validated hygiene posture for mnemo.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`. Tracks
# steady-state ("we maintain X"), the complement to bullseye's aspirational
# targets ("achieve X").
#
# Tiers are PER DIMENSION (schema v1): a dimension's held tier is the highest T
# such that every item in it with tier <= T is satisfied. `floors` is the
# per-dimension ratchet (below floor => DRIFT); `aspires` is the gap horizon;
# `enforce` is intent-only and does not affect tiers.

schema_version: 1

repo: mnemo
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 2   # make bullseye (macOS) + win-validate (Windows VM) per push; make e2e / test-scale
  security: 2      # go.sum pin + Apple Developer ID codesign step; no scanners
  quality: 1       # make vet exists; gofmt + vet gated by make bullseye before every push
  deps: 2          # go.sum committed; no Dependabot
  release: 2       # local make release: darwin-arm64 + windows zips/installers + Homebrew; no CHANGELOG
  governance: 2    # Apache-2.0 + NOTICE; PR-free direct-to-master flow; no SECURITY.md
  build: 2         # Makefile + pinned Go + go.sum + make bullseye
  docs: 2          # agents-guide + STABILITY.md + testing.md; no md-link check
  perf: 0          # one Benchmark + live scanbench; no make bench
  vcs: 1           # Git LFS for image fixtures; no committed git hooks
  agent: 2         # CLAUDE.md + bullseye.yaml + --help-agent; no AGENTS.md

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # full matrix, examples run, lint/format, release + governance
  3: hardened    # formal specs, security scanning, SBOM/signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: go test -tags sqlite_fts5 ./... runs in `make bullseye` before every push to master
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {make_target: bullseye}

  - id: correctness.make-test
    dim: correctness
    desc: "`make test` is the local shipped test path (Tier 1+2; excludes scale)"
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {make_target: test}

  - id: correctness.platform-matrix
    dim: correctness
    desc: Tests run on darwin/arm64 (make bullseye) and windows/arm64 (scripts/win-validate.sh) before every push
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: scripts/win-validate.ps1, matches: 'go test -tags sqlite_fts5'}}

  - id: correctness.e2e
    dim: correctness
    desc: Daemon-subprocess e2e suite runs locally via `make e2e` (MNEMO_E2E=1); not scheduled
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {make_target: e2e}

  - id: correctness.scale
    dim: correctness
    desc: "`make test-scale` exists for snapshot-gated Tier 3 tests"
    state: present
    cadence: periodic:7d
    enforce: informational
    tier: 2
    evidence: {make_target: test-scale}

  - id: correctness.win-validate
    dim: correctness
    desc: Local Windows ARM64 VM gate (scripts/win-validate.sh) before every push to master
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: scripts/win-validate.sh}}

  - id: correctness.release-multitarget
    dim: correctness
    desc: Release builds darwin-arm64 and windows-amd64/arm64 (Linux is not a target)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: scripts/release.sh, matches: 'windows-arm64-setup\.exe'}}

  - id: correctness.macos-tests
    dim: correctness
    desc: Unit tests run on darwin/arm64 (primary Homebrew target) via make bullseye on the dev host
    state: present
    cadence: continuous
    enforce: blocking
    tier: 3
    evidence: {make_target: bullseye}

  - id: correctness.race
    dim: correctness
    desc: go test -race runs in the local gate
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: make bullseye runs go test -tags sqlite_fts5 without -race (CGO SQLite; long pole already).
    evidence: {absent: {file: {path: Makefile, matches: 'go test .*-race'}}}

  - id: correctness.fuzz
    dim: correctness
    desc: Fuzz harnesses over ingest parsers / MCP JSON / SQL query surface
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No go test Fuzz targets or make fuzz; parsers are unit-tested only.
    evidence: {absent: {make_target: fuzz}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.dep-pinning
    dim: security
    desc: go.sum committed — reproducible, pinned module graph
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: security.apple-codesign
    dim: security
    desc: macOS release binary is Developer ID signed (Team ID stable across brew upgrade)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: scripts/release.sh, matches: 'codesign --force --options runtime'}}

  - id: security.secret-scan-github
    dim: security
    desc: GitHub secret scanning and push protection are enabled
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: Repo has secret_scanning and push protection disabled.
    evidence:
      absent:
        gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit or the local gate
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: No gitleaks config or hook; GitHub secret scanning is also off.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.dep-vuln-scan
    dim: security
    desc: govulncheck (or equivalent) scans the module graph
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: go.sum is pinned but no govulncheck/OSV job runs; Dependabot alerts are off.
    evidence: {absent: {scanner: {tool: govulncheck}}}

  - id: security.sast
    dim: security
    desc: CodeQL static analysis for Go
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: CodeQL is not enabled; go vet is the only static check, and only locally.
    evidence: {absent: {scanner: {tool: codeql}}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      No GitHub Actions workflows: gates, e2e and releases all run locally
      (PR-free flow). Re-evaluate if a workflow is ever reintroduced.
    evidence:
      absent: {file: {path: .github/workflows}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      Apple Developer ID codesign covers the darwin binary only (and is
      skipped when the release host keychain has no Developer ID identity).
      No cosign/sigstore attestation; the Homebrew formula pins sha256.
    evidence: {absent: {file: {path: scripts/release.sh, matches: 'cosign'}}}

  # ============================== CODE QUALITY ============================
  - id: quality.vet
    dim: quality
    desc: "`make vet` exists (go vet -tags sqlite_fts5 ./...); also run by make bullseye"
    state: present
    cadence: continuous
    enforce: warning
    tier: 1
    evidence: {make_target: vet}

  - id: quality.format
    dim: quality
    desc: Sources are gofmt-clean, gated by make bullseye before every push
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: Makefile, matches: 'gofmt -l'}}

  - id: quality.golangci
    dim: quality
    desc: golangci-lint (or staticcheck) is part of the local gate
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No .golangci.yml; golangci-lint/staticcheck are not invoked by make bullseye.
    evidence: {absent: {scanner: {tool: golangci-lint}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.lockfile
    dim: deps
    desc: "go.sum is committed so `go mod verify` has a pin to check"
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: deps.dependabot
    dim: deps
    desc: Dependabot (or equivalent) opens PRs for module advisories
    state: planned
    cadence: periodic:7d
    enforce: informational
    tier: 3
    reason: Dependabot security updates and vulnerability alerts are disabled; no .github/dependabot.yml.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.semver-minor
    dim: release
    desc: Latest published tag has PATCH 0 (MINOR-only releases)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: test "$(git describe --tags --abbrev=0 | grep -oE '[0-9]+$')" = "0"

  - id: release.clean-built
    dim: release
    desc: >-
      Release binaries are built by `make release` from a fresh clone of the
      released commit (darwin on the release host, windows on the VM), never
      from a working tree
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {make_target: release}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {file: {path: scripts/release.sh, matches: 'homebrew-tap'}}

  - id: release.windows-installer
    dim: release
    desc: Windows Inno Setup installer is built and uploaded on release
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {file: {path: scripts/win-release.ps1, matches: 'mnemo\.iss'}}

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no curated CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers bin/, db files, OS files, agent state, test snapshots
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.notice
    dim: governance
    desc: NOTICE attributes third-party modules in the shipped binary's build closure
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: NOTICE, matches: 'Apache License'}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.branch-protection
    dim: governance
    desc: Default branch requires a PR and a green CI check before merge
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      PR-free flow: commits go straight to master after the local gates
      (make bullseye + scripts/win-validate.sh). There is no CI to require.
      Classic protection is off (gh 404); the "master" ruleset (deletion,
      non-fast-forward, linear history) still carries pull_request and a
      required ubuntu check from the GHA era, which admins bypass.
    evidence:
      absent:
        command: gh api repos/marcelocantos/mnemo/branches/master/protection --jq .url

  - id: governance.codeowners
    dim: governance
    desc: CODEOWNERS names reviewers for the tree
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Sole-owner public repo; no review routing to encode.
    evidence: {absent: {file: {path: CODEOWNERS}}}

  # ================================= BUILD ===============================
  - id: build.makefile
    dim: build
    desc: Makefile exposes build/test/vet/fmt-check
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {make_target: build}

  - id: build.go-version-pin
    dim: build
    desc: Go toolchain version pinned in go.mod (GOTOOLCHAIN=auto selects it on the host and the VM)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.mod, matches: '(?m)^go 1\.'}}

  - id: build.reproducible-lock
    dim: build
    desc: Committed go.sum makes the module graph reproducible
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: build.bullseye
    dim: build
    desc: "`make bullseye` is the standing local invariant hook (fmt + vet + build + test + clean tree)"
    state: present
    cadence: continuous
    enforce: informational
    tier: 2
    evidence: {make_target: bullseye}

  - id: build.sqldeep-pin
    dim: build
    desc: Release and win-validate pin the same sqldeep ref
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: >-
      win-validate.sh defaults to sqldeep v0.22.0; scripts/release.sh builds
      against v0.23.0. Entropy audit ENT-002.
    evidence:
      absent:
        command: >-
          test "$(grep -oE 'WINCI_SQLDEEP_REF:-v[0-9.]+' scripts/win-validate.sh | cut -d- -f2)"
          = "$(grep -oE '^SQLDEEP_REF=.*:-v[0-9.]+' scripts/release.sh | grep -oE 'v[0-9.]+$')"

  # ============================ DOCUMENTATION ============================
  - id: docs.agents-guide
    dim: docs
    desc: Consumer / agent setup guide (agents-guide.md) is present
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: agents-guide.md}}

  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the public MCP/CLI/config/schema contract
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: STABILITY.md}}

  - id: docs.testing
    dim: docs
    desc: docs/testing.md describes the three-tier test architecture
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: docs/testing.md}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No make target checks markdown links.
    evidence: {absent: {make_target: check-md-links}}

  - id: docs.todo
    dim: docs
    desc: docs/TODO.md exists as the repo TODO sink
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      Global convention bans TODO.md; followable work lives in bullseye.yaml.
    evidence: {absent: {file: {path: docs/TODO.md}}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Go benchmark suite exists and is invocable via make bench
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      One Benchmark in store_test.go and a build-tagged live scanbench
      (internal/store/scanbench_test.go) exist; no make bench target.
    evidence: {absent: {make_target: bench}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.lfs
    dim: vcs
    desc: Image/PDF test fixtures are tracked via Git LFS
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitattributes, matches: 'filter=lfs'}}

  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (project conventions discoverable by agents)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.help-agent
    dim: agent
    desc: Binary exposes --help-agent (embedded agents-guide.md)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: main.go, matches: '"help-agent"'}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes --version
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: main.go, matches: '"version"'}}

  - id: agent.agents-md
    dim: agent
    desc: AGENTS.md present (canonical multi-tool project instructions)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: Repo has CLAUDE.md only; global convention prefers AGENTS.md as canonical.
    evidence: {absent: {file: {path: AGENTS.md}}}

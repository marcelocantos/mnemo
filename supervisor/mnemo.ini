; mnemo HTTP MCP on :19419.
; Template: supervisor/install.sh writes supervisor.d/mnemo.ini with @REPO@ expanded.
; The program runs the Homebrew Cellar binary (day-to-day MCP). Tree-built
; mnemo stays off :19419 — use another --addr for unreleased code.

[program:mnemo]
command=@REPO@/supervisor/run-mnemo.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:%(ENV_HOME)s/.claude/local:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=25
stdout_logfile=%(ENV_HOME)s/.local/var/log/mnemo.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

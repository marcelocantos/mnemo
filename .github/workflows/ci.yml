name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: cc
            cxx: c++
            ar: ar
          - os: windows-latest
            # windows-latest ships mingw-w64 preinstalled; use the
            # GCC toolchain explicitly so we do not accidentally get
            # MSVC-style behaviour via setup-go.
            cc: gcc
            cxx: g++
            ar: ar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: mnemo

      - uses: actions/checkout@v6
        with:
          repository: marcelocantos/sqldeep
          ref: v0.22.0
          path: sqldeep
          submodules: recursive

      - name: Install sqlite3 headers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          /c/msys64/usr/bin/pacman -S --needed --noconfirm mingw-w64-x86_64-sqlite3
          # sqlift's bundled sqlift.cpp does #include <sqlite3.h>;
          # CGO_CPPFLAGS applies to both C and C++ preprocessor passes so
          # cgo's C++ compile finds the header. sqlite3 *symbols* come
          # from mattn/go-sqlite3's bundled copy, so no -L/-l needed.
          echo "CGO_CPPFLAGS=-IC:/msys64/mingw64/include" >> "$GITHUB_ENV"

      - name: Build sqldeep
        working-directory: sqldeep
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          AR: ${{ matrix.ar }}
        run: |
          # sqldeep v0.22.0+ pulls liteparser/arena from the vendored
          # deepparser submodule. Mirror sqldeep's own mkfile rules:
          # compile each deepparser .c into build/deepparser/, compile
          # sqldeep.o with -Ivendor/deepparser/src, then pack everything
          # into libsqldeep.a so downstream cgo links cleanly.
          mkdir -p build/deepparser
          DP_SRC=vendor/deepparser/src
          DP_CFLAGS="-Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -O2 -DNDEBUG -I${DP_SRC}"
          for f in arena liteparser lp_tokenize lp_unparse parse; do
            "$CC" $DP_CFLAGS -c "${DP_SRC}/${f}.c" -o "build/deepparser/${f}.o"
          done
          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic -Idist -Ivendor/include -I${DP_SRC} -c dist/sqldeep.cpp -o build/sqldeep.o
          "$CC" -w -Idist -Ivendor/include -c dist/sqldeep_xml.c -o build/sqldeep_xml.o
          "$AR" rcs build/libsqldeep.a build/sqldeep.o build/deepparser/*.o

      - uses: actions/setup-go@v6
        with:
          go-version-file: mnemo/go.mod

      # 🎯T130. Defender exclusion for the paths the suite writes.
      #
      # HONEST RESULT: this was the leading hypothesis for the job's
      # slowness and it was WRONG. Measured — all four exclusions applied
      # cleanly (run 30355204617) and the job went 22m42s -> 21m25s, which
      # is inside run-to-run noise. internal/store still took 1055s against
      # 23s locally, the same 45x gap as before.
      #
      # The actual cause was fsync COUNT during schema creation, fixed in
      # applyFreshSchema (internal/store/store.go): 221 CREATE statements
      # were each running in their own implicit transaction, ~40,000
      # fsyncs per CI run across 183 fresh test stores.
      #
      # Kept because it is free, scoped, and confined to a throwaway
      # runner — and because leaving it documents the refutation, so the
      # next person investigating this job does not spend the afternoon
      # re-testing Defender.
      - name: Exclude test scratch paths from Defender (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $paths = @($env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, (go env GOMODCACHE), (go env GOCACHE)) |
                   Where-Object { $_ } | Select-Object -Unique
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "excluded: $p" }
            catch { Write-Host "could not exclude ${p}: $($_.Exception.Message)" }
          }
          # Never fail the job over this: it is a speed measure, and a
          # runner image that locks Defender down should still run tests.
          exit 0

      - name: Test
        working-directory: mnemo
        env:
          CGO_ENABLED: "1"
        # -timeout=20m covers Windows' cgo-heavy sqlift.Apply on each
        # newTestStore call, where the default 10m per-package ceiling
        # was already running ~9-10m on master before any schema growth.
        run: go test -tags sqlite_fts5 -timeout=20m ./...
